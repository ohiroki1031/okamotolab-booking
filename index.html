  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .force-hidden {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #authModal {
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .auth-icon {
      width: 56px;
      height: 56px;
      background-color: #e0e7ff;
      color: #4f46e5;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }
    .auth-title {
      margin: 0 0 4px 0;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }
    .auth-desc {
      margin: 0 0 20px 0;
      font-size: 14px;
      color: #64748b;
    }
    .auth-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 17px;
      text-align: center;
      color: #0f172a;
      outline: none;
      margin-bottom: 12px;
      user-select: text;
      -webkit-user-select: text;
    }
    .auth-input.pw-mask {
      -webkit-text-security: disc;
    }
    .auth-input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }
    .auth-error {
      color: #ef4444;
      font-size: 13px;
      margin: -4px 0 12px 0;
    }
    .auth-btn {
      width: 100%;
      padding: 12px 16px;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-btn:hover { background-color: #4338ca; }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select {
      user-select: text;
      -webkit-user-select: text;
    }
    .timeline-grid { display: grid; grid-template-columns: 165px repeat(24, minmax(72px, 1fr)); }
    @media (min-width: 768px) {
      .timeline-grid { grid-template-columns: 230px repeat(24, minmax(72px, 1fr)); }
    }
    .week-grid { display: grid; grid-template-columns: 64px repeat(7, minmax(110px, 1fr)); }
    .res-bar { transition: box-shadow 0.15s, background-color 0.15s, transform 0.15s; }
    /* 現在時刻の表示（日表示：縦線＋時刻ラベル／週表示：横線） */
    .now-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ef4444; box-shadow: 0 0 0 1px rgba(255,255,255,0.7); }
    .now-pill { position: absolute; top: 50%; transform: translate(-50%, -50%); background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 9999px; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .now-line-h { position: absolute; left: 0; right: 0; height: 2px; margin-top: -1px; background: #ef4444; z-index: 15; pointer-events: none; }
    .now-line-h::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 9999px; background: #ef4444; }
    .res-bar.dragging { opacity: 0.9; z-index: 40 !important; box-shadow: 0 10px 25px rgba(79,70,229,0.35); transform: scale(1.03); cursor: grabbing !important; }
  </style>
</head>
<body>

  <!-- ログインモーダル -->
  <div id="authModal">
    <div class="auth-card">
      <button type="button" onclick="toggleLanguage()" class="absolute top-4 right-4 px-2.5 py-1 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-100">
        <i class="fa-solid fa-globe mr-1 text-indigo-600"></i><span id="loginLangLabel">English</span>
      </button>
      <div class="auth-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0v3H9V7zm3 7a1.5 1.5 0 0 1 .75 2.8V18a.75.75 0 0 1-1.5 0v-1.2A1.5 1.5 0 0 1 12 14z"/>
        </svg>
      </div>
      <h2 id="uiAuthTitle" class="auth-title">岡本研究室 実験機器予約</h2>
      <p id="uiAuthDesc" class="auth-desc">利用するには合言葉とあなたの名前を入力してください</p>
      <form onsubmit="handleLogin(event)" autocomplete="off">
        <input type="text" id="loginActorInput" placeholder="あなたの名前 (例: Oiwa)" autocomplete="off" list="nameSuggestions" maxlength="40" required class="auth-input" />
        <p id="uiActorHint" class="text-[11px] text-slate-500 text-left mb-3 -mt-1.5"></p>
        <input type="text" id="passwordInput" placeholder="パスワードを入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required class="auth-input pw-mask" />
        <p id="authError" class="auth-error force-hidden"></p>
        <label class="flex items-center justify-center gap-1.5 text-xs text-slate-500 mb-3 cursor-pointer select-none">
          <input type="checkbox" id="rememberLogin" class="w-3.5 h-3.5 cursor-pointer" />
          <span id="uiRememberLabel">このブラウザでログイン状態を保持する（30日間）</span>
        </label>
        <button type="submit" id="uiAuthBtn" class="auth-btn">入室する</button>
      </form>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="mainApp" class="force-hidden flex-1 flex flex-col min-h-screen bg-slate-100 text-slate-800">
    <header class="bg-indigo-950 text-white shadow">
      <div class="max-w-[1700px] mx-auto px-4 py-2.5 flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center gap-2.5 flex-wrap">
          <h1 class="text-base sm:text-lg font-bold tracking-wide">
            <i class="fa-solid fa-flask mr-2 text-indigo-300"></i><span id="uiAppTitle">岡本研 実験機器予約</span>
          </h1>
          <span id="syncStatus" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full text-indigo-200">同期完了</span>
          <button onclick="loadFromCloud(false)" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-2.5 py-1 rounded-full transition">
            <i class="fa-solid fa-arrows-rotate mr-1"></i><span id="uiBtnRefresh">更新</span>
          </button>
          <button onclick="changeActorName()" id="actorBadgeBtn" class="text-xs bg-indigo-900 hover:bg-indigo-800 border border-indigo-700 px-2.5 py-1 rounded-full text-emerald-300 transition" title="名前の確認・変更">
            <i class="fa-solid fa-user mr-1"></i><span id="currentActorBadge">User</span>
          </button>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <button onclick="openNewModal()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-sm font-bold transition">
            <i class="fa-solid fa-plus mr-1"></i><span id="uiBtnNew">新規予約</span>
          </button>
          <button onclick="openMyBookings()" class="bg-emerald-800 hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-sm transition">
            <i class="fa-solid fa-user mr-1"></i><span id="uiBtnMine">自分の予約</span>

    // ブラウザの保存領域を安全に使うためのヘルパー
    // （プライベートモードや容量超過、データ破損で例外が出ても画面全体が止まらないようにする）
    function storageGet(store, key) {
      try { return window[store].getItem(key); } catch (e) { return null; }
    }
    function storageSet(store, key, value) {
      try { window[store].setItem(key, value); } catch (e) { /* 保存できなくても動作は続ける */ }
    }
    function storageRemove(store, key) {
      try { window[store].removeItem(key); } catch (e) { /* 無視 */ }
    }
    function lsGetJSON(key, fallback) {
      const raw = storageGet('localStorage', key);
      if (raw === null) return fallback;
      try { return JSON.parse(raw); } catch (e) { storageRemove('localStorage', key); return fallback; }
    }
    const lsGet = k => storageGet('localStorage', k);
    const lsSet = (k, v) => storageSet('localStorage', k, v);
    const lsRemove = k => storageRemove('localStorage', k);
    const ssGet = k => storageGet('sessionStorage', k);
    const ssSet = (k, v) => storageSet('sessionStorage', k, v);
    const ssRemove = k => storageRemove('sessionStorage', k);

    // 「ログイン状態を保持」の期間
    const REMEMBER_LOGIN_DAYS = 30;
    function getRememberedKey() {
      const saved = lsGetJSON('okamoto_key_persist', null);
      if (!saved || typeof saved.key !== 'string' || !(saved.exp > Date.now())) {
        lsRemove('okamoto_key_persist');
        return "";
      }
      return saved.key;
    }

    let currentLang = lsGet('okamoto_lang') === 'en' ? 'en' : 'ja';
    // パスワードは通常タブを閉じると消える sessionStorage にだけ保持（「保持」を選んだ場合のみ localStorage にも）
    let authKey = ssGet('okamoto_key') || getRememberedKey();
    let userRole = ssGet('okamoto_role') || (authKey ? 'member' : '');
    let currentActor = lsGet('okamoto_actor') || '';

    let currentDate = new Date();
    let miniCalDate = new Date();
    let viewMode = 'day';
    let currentFilter = 'ALL';
    let weekSelectedEq = null;
    let weekSearchQuery = "";
    let reservations = [];
    let equipments = [];
    let equipmentStatus = {};
    let minCutoffStr = "";
    let maxFutureStr = "";

    let editingId = null;
    let isSyncing = false;
    let pendingMoveData = null;
    let isUnlocked = false;
    let autoRefreshTimer = null;
    let hasScrolledInitialToday = false;
    let dragState = null;
    let touchHoldState = null;

    const tagColors = ["bg-blue-600","bg-red-600","bg-emerald-600","bg-amber-600","bg-indigo-600","bg-purple-600","bg-pink-600","bg-cyan-600","bg-teal-600"];

    // 翻訳（{name} などの部分を params で埋める）
    function t(key, params) {
      let text = (I18N[currentLang] && I18N[currentLang][key]) || I18N.ja[key] || key;
      if (params && typeof text === 'string') {
        Object.keys(params).forEach(k => { text = text.split('{' + k + '}').join(String(params[k])); });
      }
      return text;
    }

    // XSS対策用HTMLエスケープ関数
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function applyTranslations() {
      document.documentElement.lang = currentLang;
      document.getElementById('loginLangLabel').textContent = t('loginToggle');
      document.getElementById('headerLangLabel').textContent = t('headerToggle');
      document.getElementById('uiAuthTitle').textContent = t('authTitle');
      document.getElementById('uiAuthDesc').textContent = t('authDesc');
      document.getElementById('loginActorInput').placeholder = t('actorPlaceholder');
      document.getElementById('passwordInput').placeholder = t('pwPlaceholder');
      document.getElementById('uiAuthBtn').textContent = t('authBtn');

      document.getElementById('uiAppTitle').textContent = t('appTitle');
      document.getElementById('uiBtnRefresh').textContent = t('btnRefresh');
      document.getElementById('uiBtnNew').textContent = t('btnNew');
      document.getElementById('uiBtnTags').textContent = t('btnTags');
      document.getElementById('uiBtnAdmin').textContent = t('btnAdmin');
      document.getElementById('tag-ALL').textContent = t('allShow');

      document.getElementById('uiNavPrev').textContent = t('navPrev');
      document.getElementById('uiNavToday').textContent = t('navToday');
      document.getElementById('uiNavNext').textContent = t('navNext');
      document.getElementById('uiSideToday').textContent = t('navToday');
      document.getElementById('btn-view-day').textContent = t('viewDay');
      document.getElementById('btn-view-week').textContent = t('viewWeek');
      document.getElementById('dayHintText').innerHTML = `<i class="fa-solid fa-hand-pointer mr-1 text-indigo-500"></i>${escapeHtml(t('dayHint'))}`;

      const wdBox = document.getElementById('miniCalWeekdays');
      wdBox.innerHTML = t('weekdays').map((w, idx) => {
        const cls = idx === 0 ? 'text-red-500' : idx === 6 ? 'text-blue-600' : 'text-slate-600';
        return `<div class="${cls}">${escapeHtml(w)}</div>`;
      }).join('');

      document.getElementById('uiLegendTitle').textContent = t('legendTitle');
      document.getElementById('uiLegendMine').textContent = t('legendMine');
      document.getElementById('uiLegendOthers').textContent = t('legendOthers');
      document.getElementById('uiGuideBody').innerHTML = t('guideHtml');

      document.getElementById('uiAdminAuthTitle').textContent = t('adminAuthTitle');
      document.getElementById('uiAdminAuthDesc').textContent = t('adminAuthDesc');
      document.getElementById('adminPasswordInput').placeholder = t('adminPwPlaceholder');
      document.getElementById('uiAdminCancel').textContent = t('adminCancel');
      document.getElementById('uiAdminSubmit').textContent = t('adminSubmit');

      document.getElementById('uiMoveTitle').textContent = t('moveTitle');
      document.getElementById('uiMoveDesc').textContent = t('moveDesc');
      document.getElementById('uiMoveBookerLabel').textContent = t('moveBooker');
      document.getElementById('uiMoveBeforeLabel').textContent = t('moveBefore');

    function getMinAllowedDate() {
      if (minCutoffStr && /^\d{4}-\d{2}-\d{2}$/.test(minCutoffStr)) {
        return new Date(minCutoffStr + "T00:00:00");
      }
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth() - 3, 1);
    }

    function getMinAllowedDateStr() {
      return formatDateStr(getMinAllowedDate());
    }

    function getMaxFutureDateStr() {
      if (maxFutureStr && /^\d{4}-\d{2}-\d{2}$/.test(maxFutureStr)) return maxFutureStr;
      const d = new Date();
      d.setDate(d.getDate() + 365);
      return formatDateStr(d);
    }

    function clampToAllowedDate(d) {
      const minD = getMinAllowedDate();
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return target < minD ? minD : target;
    }

    function showEl(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('force-hidden');
    }

    function hideEl(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('force-hidden');
    }

    function isModalOpen(id) {
      const el = document.getElementById(id);
      return el && !el.classList.contains('force-hidden');
    }

    function isUserOperating() {
      if (isSyncing) return true;
      if (dragState !== null) return true;
      if (touchHoldState !== null) return true;
      if (pendingMoveData !== null) return true;
      if (isModalOpen('bookingModal')) return true;
      if (isModalOpen('moveConfirmModal')) return true;
      if (isModalOpen('settingsModal')) return true;
      if (isModalOpen('adminAuthModal')) return true;
      if (isModalOpen('myBookingsModal')) return true;
      return false;
    }

    function formatDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function minutesToTime(mins) {
      const clamped = Math.max(0, Math.min(1439, Math.round(mins)));
      const h = Math.floor(clamped / 60);
      const m = clamped % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function cleanTime(t) {
      if (!t) return "09:00";
      const s = String(t).trim();
      if (s.includes('T')) {
        const dt = new Date(s);
        if (!isNaN(dt.getTime())) {
          return `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        }
      }
      const parts = s.split(':');
      if (parts.length >= 2) {
        const hh = String(parseInt(parts[0], 10) || 0).padStart(2, '0');
        const mm = String(parseInt(parts[1], 10) || 0).padStart(2, '0');
        return `${hh}:${mm}`;
      }
      return "09:00";
    }

    function timeToMinutes(t) {
      const normalized = cleanTime(t);
      const [h, m] = normalized.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function cleanDate(d) {
      if (!d) return "";
      const s = String(d).trim();
      if (s.includes('T')) {
        const dt = new Date(s);
        if (!isNaN(dt.getTime())) return formatDateStr(dt);
      }
      return s.slice(0, 10);
    }

    function normalizeList(list) {
      const minStr = getMinAllowedDateStr();
      return (list || [])
        .map(r => ({
          ...r,
          id: String(r.id).trim(),
          date: cleanDate(r.date),
          endDate: cleanDate(r.endDate || r.date),
          startTime: cleanTime(r.startTime),
          endTime: cleanTime(r.endTime),
          updatedAt: String(r.updatedAt || "")
        }))
        .filter(r => r.date >= minStr || r.endDate >= minStr);
    }

    // ==========================================
    // サーバー通信
    // ==========================================
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // GASへの認証付きPOST通信
    //   ・混雑（busy）のときは少し待って最大3回まで自動で再試行
    //   ・パスワードが無効になったら（ログイン操作以外）ログイン画面に戻す
    //   ・通信自体に失敗したときは例外を投げる（呼び出し側で処理）
    async function callGasApi(payload, opts = {}) {
      const body = JSON.stringify({
        ...payload,
        key: payload.key || authKey,
        actor: currentActor,
        lang: currentLang
      });
      let json = null;
      for (let attempt = 0; ; attempt++) {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body
        });
        json = await res.json();
        if (!json || typeof json !== 'object') throw new Error('invalid response');
        if (json.status !== 'busy' || attempt >= 3) break;
        const st = document.getElementById('syncStatus');
        if (st) st.textContent = t('busyRetry', { n: attempt + 1 });
        await sleep(1500 * (attempt + 1));
      }
      if (!opts.isLogin && (json.status === 'unauthorized' || json.status === 'rateLimited')) {
        resetToLogin(t('pwChanged'));
      }
      return json;
    }

    // ログイン処理（パスワードはサーバー側で検証）
    async function handleLogin(e) {
      e.preventDefault();
      const actorVal = document.getElementById('loginActorInput').value.trim().slice(0, 40);
      const pwVal = document.getElementById('passwordInput').value;
      if (!actorVal || !pwVal) return;

      const btn = document.getElementById('uiAuthBtn');
      const errEl = document.getElementById('authError');
      btn.disabled = true;
      btn.textContent = t('verifying');
      hideEl('authError');

      try {
        const res = await callGasApi({ action: "login", key: pwVal }, { isLogin: true });
        if (res.status === "success") {
          authKey = pwVal;
          userRole = res.role === 'admin' ? 'admin' : 'member';
          setActor(actorVal);
          ssSet('okamoto_key', authKey);
          ssSet('okamoto_role', userRole);
          // ログイン状態の保持（一般用パスワードのみ。管理者パスワードはブラウザに長期保存しない）
          if (document.getElementById('rememberLogin').checked && userRole === 'member') {
            lsSet('okamoto_key_persist', JSON.stringify({ key: pwVal, exp: Date.now() + REMEMBER_LOGIN_DAYS * 86400000 }));
          } else {
            lsRemove('okamoto_key_persist');
          }
          document.getElementById('passwordInput').value = "";
          unlockApp();
        } else {
          errEl.textContent = res.message || t('pwIncorrect');
          showEl('authError');
        }
      } catch (err) {
        console.error(err);
        errEl.textContent = t('networkFail');
        showEl('authError');
      } finally {
        btn.disabled = false;
        btn.textContent = t('authBtn');
      }
    }

    // ログイン画面に戻す（パスワードが無効になったとき・ログアウトしたとき）
    function resetToLogin(errorMessage) {
      authKey = "";
      userRole = "";
      isUnlocked = false;
      editingId = null;
      pendingMoveData = null;
      dragState = null;
      reservations = [];
      favServerState = null;
      ssRemove('okamoto_key');
      ssRemove('okamoto_role');
      lsRemove('okamoto_key_persist');
      lsRemove('okamoto_res_v1'); // 共用PCで予約内容が残らないように
      if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
      ['bookingModal', 'moveConfirmModal', 'settingsModal', 'adminAuthModal', 'myBookingsModal', 'mainApp'].forEach(hideEl);
      document.body.style.backgroundColor = '#0f172a';
      document.getElementById('passwordInput').value = "";
      const errEl = document.getElementById('authError');
      if (errorMessage) {
        errEl.textContent = errorMessage;
        showEl('authError');
      } else {
        hideEl('authError');
      }
      showEl('authModal');
    }

    // 予約者名の入力候補を更新
    //   これまでの予約で使われた名前を集計し、大文字・小文字の違いは1つにまとめる
    //   （表記は一番多く使われているもの）。自分の名前を先頭に、あとは使用回数順。
    function updateNameSuggestions() {
      const groups = {};
      reservations.forEach(r => {
        const name = String(r.title || "").trim();
        if (!name) return;
        const key = name.toLowerCase();
        groups[key] = groups[key] || {};
        groups[key][name] = (groups[key][name] || 0) + 1;
      });
      const names = Object.values(groups).map(g => {
        const entries = Object.entries(g).sort((a, b) => b[1] - a[1]);
        return { name: entries[0][0], count: entries.reduce((sum, e) => sum + e[1], 0) };
      });
      const me = currentActor.trim().toLowerCase();
      names.sort((a, b) => {
        if (me && a.name.toLowerCase() === me) return -1;
        if (me && b.name.toLowerCase() === me) return 1;
        return b.count - a.count || a.name.localeCompare(b.name);
      });
      document.getElementById('nameSuggestions').innerHTML =
        names.map(n => `<option value="${escapeHtml(n.name)}"></option>`).join('');
    }
