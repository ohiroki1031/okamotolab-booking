<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岡本研 実験機器予約システム / Okamoto Lab Equipment Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .force-hidden {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #authModal {
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .auth-icon {
      width: 56px;
      height: 56px;
      background-color: #e0e7ff;
      color: #4f46e5;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }
    .auth-title {
      margin: 0 0 4px 0;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }
    .auth-desc {
      margin: 0 0 20px 0;
      font-size: 14px;
      color: #64748b;
    }
    .auth-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 17px;
      text-align: center;
      color: #0f172a;
      outline: none;
      margin-bottom: 12px;
      user-select: text;
      -webkit-user-select: text;
    }
    .auth-input.pw-mask {
      -webkit-text-security: disc;
    }
    .auth-input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }
    .auth-error {
      color: #ef4444;
      font-size: 13px;
      margin: -4px 0 12px 0;
    }
    .auth-btn {
      width: 100%;
      padding: 12px 16px;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-btn:hover { background-color: #4338ca; }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select {
      user-select: text;
      -webkit-user-select: text;
    }
    .timeline-grid { display: grid; grid-template-columns: 165px repeat(24, minmax(72px, 1fr)); }
    @media (min-width: 768px) {
      .timeline-grid { grid-template-columns: 230px repeat(24, minmax(72px, 1fr)); }
    }
    .week-grid { display: grid; grid-template-columns: 64px repeat(7, minmax(110px, 1fr)); }
    .res-bar { transition: box-shadow 0.15s, background-color 0.15s, transform 0.15s; }
    .res-bar.dragging { opacity: 0.9; z-index: 40 !important; box-shadow: 0 10px 25px rgba(79,70,229,0.35); transform: scale(1.03); cursor: grabbing !important; }
  </style>
</head>
<body>

  <!-- ログインモーダル -->
  <div id="authModal">
    <div class="auth-card">
      <button type="button" onclick="toggleLanguage()" class="absolute top-4 right-4 px-2.5 py-1 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-100">
        <i class="fa-solid fa-globe mr-1 text-indigo-600"></i><span id="loginLangLabel">English</span>
      </button>
      <div class="auth-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0v3H9V7zm3 7a1.5 1.5 0 0 1 .75 2.8V18a.75.75 0 0 1-1.5 0v-1.2A1.5 1.5 0 0 1 12 14z"/>
        </svg>
      </div>
      <h2 id="uiAuthTitle" class="auth-title">岡本研究室 実験機器予約</h2>
      <p id="uiAuthDesc" class="auth-desc">利用するには合言葉とあなたの名前を入力してください</p>
      <form onsubmit="handleLogin(event)" autocomplete="off">
        <input type="text" id="loginActorInput" placeholder="あなたの名前 (例: Oiwa)" autocomplete="off" required class="auth-input" />
        <input type="text" id="passwordInput" placeholder="パスワードを入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required class="auth-input pw-mask" />
        <p id="authError" class="auth-error force-hidden"></p>
        <button type="submit" id="uiAuthBtn" class="auth-btn">入室する</button>
      </form>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="mainApp" class="force-hidden flex-1 flex flex-col min-h-screen bg-slate-100 text-slate-800">
    <header class="bg-indigo-950 text-white shadow">
      <div class="max-w-[1700px] mx-auto px-4 py-2.5 flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center gap-2.5 flex-wrap">
          <h1 class="text-base sm:text-lg font-bold tracking-wide">
            <i class="fa-solid fa-flask mr-2 text-indigo-300"></i><span id="uiAppTitle">岡本研 実験機器予約</span>
          </h1>
          <span id="syncStatus" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full text-indigo-200">同期完了</span>
          <button onclick="loadFromCloud(false)" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-2.5 py-1 rounded-full transition">
            <i class="fa-solid fa-arrows-rotate mr-1"></i><span id="uiBtnRefresh">更新</span>
          </button>
          <button onclick="changeActorName()" class="text-xs bg-indigo-900 hover:bg-indigo-800 border border-indigo-700 px-2.5 py-1 rounded-full text-emerald-300 transition" title="操作者名を変更">
            <i class="fa-solid fa-user mr-1"></i><span id="currentActorBadge">User</span>
          </button>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <button onclick="openNewModal()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-sm font-bold transition">
            <i class="fa-solid fa-plus mr-1"></i><span id="uiBtnNew">新規予約</span>
          </button>
          <button onclick="toggleTagBar()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg text-sm transition">
            <i class="fa-solid fa-tags mr-1"></i><span id="uiBtnTags">機器タグ</span>
          </button>
          <button onclick="requestAdminSettings()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg text-sm transition flex items-center gap-1.5">
            <i id="adminLockIcon" class="fa-solid fa-lock text-amber-300 text-xs"></i>
            <span id="uiBtnAdmin">機器管理</span>
          </button>
          <button onclick="toggleLanguage()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
            <i class="fa-solid fa-globe mr-1 text-indigo-300"></i><span id="headerLangLabel">EN</span>
          </button>
          <button onclick="logout()" class="bg-indigo-900 hover:bg-red-800 px-2.5 py-1.5 rounded-lg text-xs text-indigo-200 transition" title="ログアウト">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- 機器タグフィルターバー -->
    <div id="tagBar" class="force-hidden bg-white border-b border-slate-200 px-4 py-2.5">
      <div class="max-w-[1700px] mx-auto flex flex-wrap gap-1.5 items-center">
        <button onclick="filterByEquipment('ALL')" id="tag-ALL" class="px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white">全て表示</button>
        <div id="tagButtonsContainer" class="flex flex-wrap gap-1.5"></div>
      </div>
    </div>

    <!-- ナビゲーションバー -->
    <div class="bg-white border-b border-slate-200">
      <div class="max-w-[1700px] mx-auto px-4 py-2 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-2">
          <button id="navPrevBtn" onclick="changeDate(-1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50 text-sm disabled:opacity-40 disabled:cursor-not-allowed"><i class="fa-solid fa-chevron-left"></i> <span id="uiNavPrev">前へ</span></button>
          <button onclick="goToday()" class="px-3 py-1.5 border rounded-lg text-sm font-bold hover:bg-slate-50"><span id="uiNavToday">本日</span></button>
          <button onclick="changeDate(1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50 text-sm"><span id="uiNavNext">次へ</span> <i class="fa-solid fa-chevron-right"></i></button>
          <span id="currentDateLabel" class="text-base sm:text-lg font-bold ml-1 sm:ml-2 text-slate-800"></span>
        </div>
        <div class="flex items-center gap-3">
          <span id="dayHintText" class="hidden xl:inline text-xs text-slate-500"></span>
          <div class="flex items-center bg-slate-100 p-1 rounded-lg">
            <button onclick="setViewMode('day')" id="btn-view-day" class="px-4 py-1.5 rounded-md text-sm font-bold bg-white shadow-sm">日表示 (一覧)</button>
            <button onclick="setViewMode('week')" id="btn-view-week" class="px-4 py-1.5 rounded-md text-sm font-medium text-slate-600">週表示</button>
          </div>
        </div>
      </div>
    </div>

    <!-- メインレイアウト -->
    <div class="flex-1 max-w-[1700px] w-full mx-auto p-3 flex flex-col md:flex-row gap-3">
      <!-- 左サイドバー -->
      <aside class="w-full md:w-60 shrink-0 space-y-3">
        <div class="bg-white rounded-xl shadow border border-slate-200 p-3">
          <div class="flex items-center justify-between mb-2">
            <button id="miniPrevMonthBtn" onclick="changeMiniCalMonth(-1)" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-100 text-slate-600 font-bold disabled:opacity-30 disabled:cursor-not-allowed">&lt;</button>
            <span id="miniCalTitle" class="text-sm font-bold text-slate-800"></span>
            <button onclick="changeMiniCalMonth(1)" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-100 text-slate-600 font-bold">&gt;</button>
          </div>
          <div id="miniCalWeekdays" class="grid grid-cols-7 text-center text-[11px] font-bold mb-1"></div>
          <div id="miniCalGrid" class="grid grid-cols-7 gap-0.5 text-center text-xs"></div>
          <div class="grid grid-cols-3 gap-1 mt-3 pt-2 border-t border-slate-100">
            <button id="sidePrevBtn" onclick="changeDate(-1)" class="py-1 bg-slate-100 hover:bg-slate-200 rounded text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed">◀</button>
            <button onclick="goToday()" id="uiSideToday" class="py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded text-xs font-bold">本日</button>
            <button onclick="changeDate(1)" class="py-1 bg-slate-100 hover:bg-slate-200 rounded text-xs font-medium">▶</button>
          </div>
          <div id="retentionNote" class="mt-2 text-[10px] text-slate-400 text-center"></div>
        </div>

        <!-- 凡例＆操作ガイド -->
        <div class="bg-white rounded-xl shadow border border-slate-200 p-3 text-xs text-slate-600 space-y-2">
          <div id="uiLegendTitle" class="font-bold text-slate-800">凡例・操作ガイド</div>
          <div class="flex items-center gap-2 text-[11px]">
            <span class="inline-block w-3.5 h-3.5 rounded bg-emerald-50 border-2 border-emerald-600 shrink-0"></span>
            <span id="uiLegendMine">あなたの予約</span>
            <span class="inline-block w-3.5 h-3.5 rounded bg-white border-2 border-indigo-600 shrink-0 ml-1"></span>
            <span id="uiLegendOthers">他メンバー</span>
          </div>
          <div id="uiGuideBody" class="space-y-1 text-[11px] pt-1 border-t border-slate-100"></div>
        </div>
      </aside>

      <!-- 右メイン領域：予約表 -->
      <main class="flex-1 min-w-0">
        <div id="calendarContainer" class="bg-white rounded-xl shadow border border-slate-200 overflow-x-auto relative"></div>
      </main>
    </div>
  </div>

  <!-- 管理者パスワード認証モーダル -->
  <div id="adminAuthModal" class="force-hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center">
      <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h3 id="uiAdminAuthTitle" class="text-base font-bold text-slate-900 mb-1">管理者認証</h3>
      <p id="uiAdminAuthDesc" class="text-xs text-slate-500 mb-4">実験機器リスト・状態の編集は管理者のみ許可されています。</p>
      <form onsubmit="handleAdminLogin(event)" autocomplete="off" class="space-y-3">
        <input type="text" id="adminPasswordInput" placeholder="管理者パスワード" autocomplete="off" required
          style="-webkit-text-security: disc;"
          class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-center text-base focus:ring-2 focus:ring-amber-500 focus:outline-none" />
        <p id="adminAuthError" class="force-hidden text-red-500 text-xs"></p>
        <div class="flex gap-2 pt-1">
          <button type="button" onclick="hideEl('adminAuthModal')" id="uiAdminCancel" class="flex-1 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50">キャンセル</button>
          <button type="submit" id="uiAdminSubmit" class="flex-1 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm font-bold">認証する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ドラッグ移動 確認モーダル -->
  <div id="moveConfirmModal" class="force-hidden fixed inset-0 bg-black/55 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-lg shrink-0">
          <i class="fa-solid fa-arrows-up-down-left-right"></i>
        </div>
        <div>
          <h3 id="uiMoveTitle" class="text-base font-bold text-slate-900">予約内容の変更確認</h3>
          <p id="uiMoveDesc" class="text-xs text-slate-500">以下の内容で予約を変更してよろしいですか？</p>
        </div>
      </div>

      <!-- 他人予約の強い警告バナー -->
      <div id="moveOtherWarning" class="force-hidden mb-3 p-2.5 rounded-lg bg-red-50 border border-red-300 text-red-800 text-xs font-bold flex items-start gap-2">
        <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
        <span id="moveOtherWarningText"></span>
      </div>

      <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-200 space-y-2.5 text-sm mb-5">
        <div class="flex justify-between items-center pb-2 border-b border-slate-200">
          <span id="uiMoveBookerLabel" class="text-xs font-bold text-slate-500">予約者</span>
          <span id="confirmMoveTitle" class="font-bold text-slate-900"></span>
        </div>
        <div>
          <div id="uiMoveBeforeLabel" class="text-[11px] font-bold text-slate-400 mb-0.5">変更前</div>
          <div id="confirmMoveBefore" class="text-xs text-slate-600 bg-white px-2.5 py-1.5 rounded border border-slate-200"></div>
        </div>
        <div class="text-center text-indigo-600 text-xs"><i class="fa-solid fa-arrow-down"></i></div>
        <div>
          <div id="uiMoveAfterLabel" class="text-[11px] font-bold text-indigo-600 mb-0.5">変更後</div>
          <div id="confirmMoveAfter" class="text-xs font-bold text-indigo-950 bg-indigo-50 px-2.5 py-1.5 rounded border border-indigo-300"></div>
        </div>
      </div>

      <div class="flex gap-2 justify-end">
        <button type="button" onclick="cancelPendingMove()" id="uiMoveCancel" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">キャンセル</button>
        <button type="button" id="confirmMoveBtn" onclick="executePendingMove()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold shadow-sm">変更する</button>
      </div>
    </div>
  </div>

  <!-- 予約作成・編集モーダル -->
  <div id="bookingModal" class="force-hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h3 id="modalTitle" class="text-lg font-bold text-indigo-950">新規予約</h3>
        <!-- ワンクリック時間調整ボタン（編集時のみ表示） -->
        <div id="quickActionBtns" class="force-hidden flex items-center gap-1.5">
          <button type="button" onclick="quickExtend30()" id="uiQuickExtend" class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg text-xs font-bold">
            +30分延長
          </button>
          <button type="button" onclick="quickFinishNow()" id="uiQuickFinish" class="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold">
            今すぐ終了
          </button>
        </div>
      </div>

      <!-- 他人予約の強い警告バナー -->
      <div id="modalOtherWarning" class="force-hidden mb-3 p-2.5 rounded-lg bg-red-50 border border-red-300 text-red-800 text-xs font-bold flex items-start gap-2">
        <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
        <span id="modalOtherWarningText"></span>
      </div>

      <form onsubmit="saveBooking(event)" class="space-y-3.5">
        <div>
          <label id="uiLblEq" class="block text-xs font-bold text-slate-600 mb-1">実験機器</label>
          <select id="modalEquipment" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm"></select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label id="uiLblName" class="block text-xs font-bold text-slate-600 mb-1">予約者名</label>
            <input type="text" id="modalName" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" />
          </div>
          <div>
            <label id="uiLblStartDate" class="block text-xs font-bold text-slate-600 mb-1">開始日付</label>
            <input type="date" id="modalStartDate" onchange="handleStartDateChange()" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label id="uiLblStartTime" class="block text-xs font-bold text-slate-600 mb-1">開始時間</label>
            <input type="time" id="modalStartTime" onchange="handleStartTimeChange()" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" />
          </div>
          <div>
            <label id="uiLblEndDate" class="block text-xs font-bold text-slate-600 mb-1">終了日付</label>
            <input type="date" id="modalEndDate" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label id="uiLblEndTime" class="block text-xs font-bold text-slate-600 mb-1">終了時間</label>
            <input type="time" id="modalEndTime" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" />
          </div>
          <div>
            <label id="uiLblNotes" class="block text-xs font-bold text-slate-600 mb-1">備考テキスト</label>
            <input type="text" id="modalNotes" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" />
          </div>
        </div>

        <!-- 新規作成時：繰り返し設定 -->
        <div id="repeatSection" class="border-t pt-3">
          <label class="block text-xs font-bold text-indigo-900 mb-1"><i class="fa-solid fa-rotate mr-1"></i><span id="uiLblRepeat">繰り返し予約</span></label>
          <div class="flex gap-2">
            <select id="modalRepeatType" onchange="toggleRepeatOptions()" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm">
              <option value="none" id="optRepNone">繰り返さない</option>
              <option value="daily" id="optRepDaily">毎日</option>
              <option value="weekly" id="optRepWeekly">毎週</option>
              <option value="biweekly" id="optRepBiweekly">隔週 (2週間ごと)</option>
              <option value="monthly" id="optRepMonthly">毎月</option>
            </select>
            <div id="repeatCountBox" class="force-hidden flex items-center gap-1">
              <input type="number" id="modalRepeatCount" min="2" max="30" value="4" class="w-16 border border-slate-300 rounded-lg p-2 text-sm text-center" />
              <span id="uiLblTimes" class="text-xs text-slate-600">回分</span>
            </div>
          </div>
        </div>

        <!-- 編集時：繰り返しシリーズの一括適用選択 -->
        <div id="seriesScopeSection" class="force-hidden border-t pt-3 bg-indigo-50/70 p-3 rounded-xl">
          <label id="uiLblSeriesScope" class="block text-xs font-bold text-indigo-950 mb-1.5">
            <i class="fa-solid fa-layer-group mr-1 text-indigo-600"></i>繰り返し予約の適用範囲
          </label>
          <div class="space-y-1 text-xs">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="seriesScope" value="single" checked />

    function getMinAllowedDate() {
      if (minCutoffStr && /^\d{4}-\d{2}-\d{2}$/.test(minCutoffStr)) {
        return new Date(minCutoffStr + "T00:00:00");
      }
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth() - 3, 1);
    }

    function getMinAllowedDateStr() {
      return formatDateStr(getMinAllowedDate());
    }

    function getMaxFutureDateStr() {
      if (maxFutureStr && /^\d{4}-\d{2}-\d{2}$/.test(maxFutureStr)) return maxFutureStr;
      const d = new Date();
      d.setDate(d.getDate() + 365);
      return formatDateStr(d);
    }

    function clampToAllowedDate(d) {
      const minD = getMinAllowedDate();
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return target < minD ? minD : target;
    }
