    async function loadFromCloud(isBackgroundAuto = false) {
      if (!authKey) return;
      if (isBackgroundAuto && isUserOperating()) return;

      const status = document.getElementById('syncStatus');
      if (status && !isBackgroundAuto) status.textContent = t('syncing');

      try {
        const json = await callGasApi({ action: "list" });
        if (!authKey) return; // ログイン画面に戻った
        if (json.status !== "success") {
          if (status) status.textContent = t('syncFailed');
          return;
        }
        if (isBackgroundAuto && isUserOperating()) return;

        if (json.cutoffDate) minCutoffStr = json.cutoffDate;
        if (json.maxFutureDate) maxFutureStr = json.maxFutureDate;
        if (json.role) {
          userRole = json.role;
          ssSet('okamoto_role', userRole);
          updateAdminIconState();
        }
        reservations = normalizeList(json.reservations || []);
        lsSet('okamoto_res_v1', JSON.stringify(reservations));

        if (Array.isArray(json.equipments) && json.equipments.length > 0) {
          equipments = json.equipments;
          lsSet('okamoto_eq_v1', JSON.stringify(equipments));
        }
        equipmentStatus = (json.equipmentStatus && typeof json.equipmentStatus === 'object') ? json.equipmentStatus : {};
        lsSet('okamoto_eq_status_v1', JSON.stringify(equipmentStatus));
        if ('favorites' in json) applyServerFavorites(json.favorites);

        if (status) {
          const now = new Date();
          const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
          status.textContent = isBackgroundAuto ? t('autoSynced', { time }) : t('syncDone');
        }
        updateRetentionLabel();
        updateNameSuggestions();
        renderTagButtons();
        renderMiniCalendar();
        renderCalendar();
      } catch (err) {
        console.error(err);
        if (status && !isBackgroundAuto) status.textContent = t('syncError');
      }
    }

    function startAutoRefreshTimer() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if (!isUnlocked || isUserOperating()) return;
        loadFromCloud(true);
      }, AUTO_REFRESH_INTERVAL_MS);
    }

    // 書き込み系の操作をサーバーへ送る。
    // 戻り値は必ずオブジェクト（status が "success" 以外は失敗。呼び出し側で notifyFailure を使って知らせる）
    async function sendTransaction(payload) {
      const status = document.getElementById('syncStatus');
      if (isSyncing) return { status: "syncing", message: t('stillSyncing') };
      isSyncing = true;
      if (status) status.textContent = t('syncing');

      try {
        const result = await callGasApi(payload);
        if (result.status === 'unauthorized' || result.status === 'rateLimited') {
          return { ...result, silent: true }; // ログイン画面に戻したので通知しない
        }
        if (result.status === 'forbidden') {
          userRole = 'member';
          ssSet('okamoto_role', userRole);
          updateAdminIconState();
          hideEl('settingsModal');
        }
        // 成功・失敗にかかわらず、サーバーが最新の一覧を返してきたら反映する
        if (Array.isArray(result.reservations)) {
          reservations = normalizeList(result.reservations);
          lsSet('okamoto_res_v1', JSON.stringify(reservations));
        }
        if (Array.isArray(result.equipments) && result.equipments.length > 0) {
          equipments = result.equipments;
          lsSet('okamoto_eq_v1', JSON.stringify(equipments));
        }
        if (result.equipmentStatus && typeof result.equipmentStatus === 'object') {
          equipmentStatus = result.equipmentStatus;
          lsSet('okamoto_eq_status_v1', JSON.stringify(equipmentStatus));
        }
        if (status) status.textContent = result.status === 'success' ? t('syncDone') : t('syncFailed');
        return result;
      } catch (err) {
        console.error(err);
        if (status) status.textContent = t('syncError');
        return { status: "network", message: t('networkFail') };
      } finally {
        isSyncing = false;
        // 成功・失敗どちらでも、手元のデータの状態で描き直す（ドラッグで動かしたバーも元に戻る）
        if (isUnlocked) {
          updateNameSuggestions();
          renderTagButtons();
          renderMiniCalendar();
          renderCalendar();
        }
      }
    }

    // 失敗した操作を利用者に知らせる（成功・ログイン画面に戻った場合は何もしない）
    function notifyFailure(res, fallbackMessage) {
      if (!res || res.silent || res.status === "success") return;
      alert(res.message || fallbackMessage || t('opFailed'));
    }

    // 機器の稼働状態ヘルパー
    function getEqStatusInfo(eq) {
      const stObj = equipmentStatus[eq];
      if (!stObj || !stObj.status) return null;
      const map = {
        broken:      { label: t('statusBroken'), cls: "bg-red-100 text-red-700 border-red-300", note: stObj.note || "" },
        maintenance: { label: t('statusMaint'), cls: "bg-amber-100 text-amber-800 border-amber-300", note: stObj.note || "" },
        stopped:     { label: t('statusStopped'), cls: "bg-slate-200 text-slate-700 border-slate-400", note: stObj.note || "" }
      };
      return map[stObj.status] || null;
    }

    function isEqUnavailable(eq) {
      return !!(equipmentStatus[eq] && equipmentStatus[eq].status);
    }

    // 自分の予約かどうか判定（大文字小文字・前後空白を無視して一致判定）
    function isMyBooking(item) {
      if (!currentActor || !item || !item.title) return false;
      return item.title.trim().toLowerCase() === currentActor.trim().toLowerCase();
    }

    // ---------- お気に入り機器（名前ごとにスプレッドシートへ保存し、端末をまたいで同期） ----------
    //   すぐ表示できるよう、このブラウザにも写しを持つ（サーバーの内容を読み込んだら置き換える）
    function favStorageKey() {
      return 'okamoto_fav_' + (currentActor || '').trim().toLowerCase();
    }
    function getFavorites() {
      const list = lsGetJSON(favStorageKey(), []);
      return Array.isArray(list) ? list.filter(x => typeof x === 'string') : [];
    }
    function setLocalFavorites(list) {
      lsSet(favStorageKey(), JSON.stringify(Array.isArray(list) ? list : []));
    }
    function isFavorite(eq) {
      return getFavorites().includes(eq);
    }

    let favServerState = null;   // サーバーで確認済みのお気に入り（保存に失敗したらここへ戻す）
    let favSaveInFlight = false; // 保存中
    let favSaveDirty = false;    // 保存中にさらに変更された

    // サーバーから受け取ったお気に入りを反映（未保存=null なら、この端末の分をサーバーへ送る）
    function applyServerFavorites(serverFavs) {
      if (favSaveInFlight) return; // 保存中は手元の最新の状態を優先
      if (Array.isArray(serverFavs)) {
        favServerState = serverFavs.slice();
        setLocalFavorites(serverFavs);
      } else if (serverFavs === null) {
        favServerState = [];
        if (getFavorites().length > 0) queueFavSave(); // 以前この端末だけに保存していた分を引き継ぐ
      }
    }

    function toggleFavorite(eq) {
      const favs = getFavorites();
      const i = favs.indexOf(eq);
      if (i >= 0) favs.splice(i, 1);
      else favs.push(eq);
      setLocalFavorites(favs);
      renderTagButtons();
      renderCalendar();
      queueFavSave();
    }

    // お気に入りをサーバーへ保存。連打しても順番が入れ替わらないよう1件ずつ送り、最後の状態を必ず保存する
    async function queueFavSave() {
      if (favSaveInFlight) { favSaveDirty = true; return; }
      favSaveInFlight = true;
      const actorAtStart = currentActor;
      let failedMessage = null;
      try {
        do {
          favSaveDirty = false;
          const res = await callGasApi({ action: 'saveFavorites', favorites: getFavorites() });
          if (res.status === 'unauthorized' || res.status === 'rateLimited') return; // ログイン画面に戻った
          if (res.status !== 'success') { failedMessage = res.message || t('favSaveFailed'); break; }
          if (currentActor !== actorAtStart) break;
          favServerState = Array.isArray(res.favorites) ? res.favorites.slice() : getFavorites();
          if (!favSaveDirty) setLocalFavorites(favServerState);
        } while (favSaveDirty);
      } catch (err) {
        console.error(err);
        failedMessage = t('favSaveFailed');
      } finally {
        favSaveInFlight = false;
      }
      if (failedMessage && currentActor === actorAtStart) {
        // 保存できなかったので、サーバーにある状態へ戻す
        if (Array.isArray(favServerState)) setLocalFavorites(favServerState);
        if (isUnlocked) { renderTagButtons(); renderCalendar(); }
        alert(failedMessage);
      }
    }
    // 表示順：お気に入り（機器リストの順）→ それ以外
    function orderedEquipments() {
      const favs = getFavorites();
      return equipments.filter(e => favs.includes(e)).concat(equipments.filter(e => !favs.includes(e)));
    }
    // ☆/★ ボタン（HTML）
    function favButtonHtml(eq, extraCls = '') {
      const fav = isFavorite(eq);
      return `<button type="button" data-eq="${escapeHtml(eq)}" onclick="event.stopPropagation(); toggleFavorite(this.dataset.eq)"
        title="${escapeHtml(t(fav ? 'favRemove' : 'favAdd'))}"
        class="fav-btn shrink-0 text-base leading-none ${fav ? 'text-amber-400' : 'text-slate-300 hover:text-amber-400'} ${extraCls}">${fav ? '★' : '☆'}</button>`;
    }

    // 機器名の横に出す状態バッジ（HTML）
    function statusBadgeHtml(eq) {
      const stInfo = getEqStatusInfo(eq);
      return stInfo ? `<span class="shrink-0 text-[9px] px-1.5 py-0.5 rounded border font-bold ${stInfo.cls}">${escapeHtml(stInfo.label)}</span>` : '';
    }

    // ---------- 日時の計算（日をまたぐ予約・24:00終了に対応） ----------
    // "yyyy-MM-dd" → 通算日数
    function dayNum(s) {
      const [y, m, d] = String(s).split('-').map(Number);
      return Math.round(Date.UTC(y, m - 1, d) / 86400000);
    }
    function addDaysStr(s, n) {
      const dt = new Date(s + "T00:00:00");
      dt.setDate(dt.getDate() + n);
      return formatDateStr(dt);
    }
    function resEndDate(r) {
      return r.endDate || r.date;
    }
    function absStartMin(r) {
      return dayNum(r.date) * 1440 + timeToMinutes(r.startTime);
    }
    function absEndMin(r) {
      return dayNum(resEndDate(r)) * 1440 + timeToMinutes(r.endTime);
    }
    function nowAbsMin() {
      const n = new Date();
      return dayNum(formatDateStr(n)) * 1440 + n.getHours() * 60 + n.getMinutes();
    }
    // 翌日0:00に終わる予約は「その日の24:00まで」の1日の予約として扱う
    function endsAtMidnight(r) {
      return dayNum(resEndDate(r)) - dayNum(r.date) === 1 && r.endTime === "00:00";
    }
    function isMultiDay(r) {
      return resEndDate(r) !== r.date && !endsAtMidnight(r);
    }
    function endTimeLabel(r) {
      return endsAtMidnight(r) ? "24:00" : r.endTime;
    }
    // 指定日に表示する区間（その日の0:00からの分）。その日にかからなければ null
    function segmentOnDay(r, dateStr) {
      const base = dayNum(dateStr) * 1440;
      const s = absStartMin(r) - base;
      const e = absEndMin(r) - base;
      const ss = Math.max(0, s);
      const ee = Math.min(1440, e);
      if (ee <= ss) return null;
      return { s: ss, e: ee, startsBefore: s < 0, endsAfter: e > 1440 };
    }
    // "M/D (曜)"
    function shortDateLabel(dateStr) {
      const dt = new Date(dateStr + "T00:00:00");
      return `${dt.getMonth() + 1}/${dt.getDate()} (${t('weekdays')[dt.getDay()]})`;
    }
    // 予約の日時範囲の表示用文字列
    function rangeLabel(r) {
      const sep = currentLang === 'en' ? '–' : '〜';
      const end = isMultiDay(r) ? `${shortDateLabel(resEndDate(r))} ${r.endTime}` : endTimeLabel(r);
      return `${shortDateLabel(r.date)} ${r.startTime} ${sep} ${end}`;
    }

    // ---------- 現在時刻の線 ----------
    const WEEK_HOUR_HEIGHT = 36;
    let nowTimer = null;

    // data-now="x"（日表示：横方向の位置）/ "y"（週表示：縦方向の位置）の要素を現在時刻に合わせる
    function updateNowIndicators() {
      const now = new Date();
      const todayStr = formatDateStr(now);
      const mins = now.getHours() * 60 + now.getMinutes();
      const label = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.querySelectorAll('[data-now]').forEach(el => {
        const show = el.dataset.date === todayStr;
        el.style.display = show ? '' : 'none';
        if (!show) return;
        if (el.dataset.now === 'y') el.style.top = `${(mins / 60) * WEEK_HOUR_HEIGHT}px`;
        else el.style.left = `${(mins / 1440) * 100}%`;
        if (el.classList.contains('now-pill')) el.textContent = label;
      });
    }

    function startNowTimer() {
      if (nowTimer) clearInterval(nowTimer);
      nowTimer = setInterval(updateNowIndicators, 30000);
    }

    // 同じ機器で時間帯が重なる予約があるか（日をまたぐ予約にも対応）
    function hasConflict(eq, sDate, eDate, st, et, ignoreIds = {}) {
      const probe = { date: sDate, endDate: eDate, startTime: st, endTime: et };
      const s1 = absStartMin(probe);
      const e1 = absEndMin(probe);
      return reservations.some(r => {
        if (ignoreIds && ignoreIds[r.id]) return false;
        if (r.equipment !== eq) return false;
        return s1 < absEndMin(r) && e1 > absStartMin(r);
      });
    }

    // ミニ月間カレンダー描画
    function changeMiniCalMonth(diff) {
      const minD = getMinAllowedDate();
      const target = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() + diff, 1);
      if (target < new Date(minD.getFullYear(), minD.getMonth(), 1)) return;
      miniCalDate = target;
      renderMiniCalendar();
    }

    function selectDateFromMiniCal(dateStr) {
      if (dateStr < getMinAllowedDateStr()) return;
      currentDate = new Date(dateStr + "T00:00:00");
      miniCalDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
      hasScrolledInitialToday = true;
      renderMiniCalendar();
      renderCalendar();
    }

    function renderMiniCalendar() {
      const y = miniCalDate.getFullYear();
      const m = miniCalDate.getMonth();
      document.getElementById('miniCalTitle').textContent = currentLang === 'en'
        ? new Date(y, m, 1).toLocaleDateString('en-US', { year: 'numeric', month: 'long' })
        : `${y}年${m + 1}月`;

      const minD = getMinAllowedDate();
      const minMonthFirst = new Date(minD.getFullYear(), minD.getMonth(), 1);
      const currMonthFirst = new Date(y, m, 1);
      const miniPrevBtn = document.getElementById('miniPrevMonthBtn');
      if (miniPrevBtn) miniPrevBtn.disabled = currMonthFirst <= minMonthFirst;

      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();
      const selectedStr = formatDateStr(currentDate);
      const todayStr = formatDateStr(new Date());
      const minStr = getMinAllowedDateStr();

      let html = '';
      for (let i = 0; i < firstDay; i++) html += `<div class="py-1.5"></div>`;
      for (let day = 1; day <= lastDate; day++) {
        const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isDisabled = dStr < minStr;
        const isSelected = dStr === selectedStr;
        const isToday = dStr === todayStr;
        // その日にかかる予約があれば印（自分の予約があれば緑、なければ青）
        const dayRes = isDisabled ? [] : reservations.filter(r => r.date <= dStr && resEndDate(r) >= dStr && segmentOnDay(r, dStr));
        const hasRes = dayRes.length > 0;
        const hasMine = dayRes.some(isMyBooking);
        const dow = (firstDay + day - 1) % 7;

        let cls = "py-1.5 rounded-md relative font-medium transition ";
        if (isDisabled) cls += "text-slate-300 cursor-not-allowed ";
        else if (isSelected) cls += "bg-indigo-600 text-white font-bold shadow-sm cursor-pointer ";
        else if (isToday) cls += "bg-indigo-100 text-indigo-800 font-bold cursor-pointer ";
        else if (dow === 0) cls += "text-red-500 hover:bg-slate-100 cursor-pointer ";
        else if (dow === 6) cls += "text-blue-600 hover:bg-slate-100 cursor-pointer ";
        else cls += "text-slate-700 hover:bg-slate-100 cursor-pointer ";

        html += `<div ${isDisabled ? '' : `onclick="selectDateFromMiniCal('${dStr}')"`} class="${cls}">
          ${day}
          ${hasRes && !isSelected ? `<span class="block ${hasMine ? 'w-1.5 h-1.5 bg-emerald-500' : 'w-1 h-1 bg-indigo-400'} rounded-full mx-auto mt-0.5"></span>` : ''}
        </div>`;
      }
      document.getElementById('miniCalGrid').innerHTML = html;
    }

    function setViewMode(mode) {
      viewMode = mode;
      ['day', 'week'].forEach(m => {
        const btn = document.getElementById(`btn-view-${m}`);
        btn.className = m === mode
          ? "px-4 py-1.5 rounded-md text-sm font-bold bg-white shadow-sm"
          : "px-4 py-1.5 rounded-md text-sm font-medium text-slate-600";
      });
      document.getElementById('dayHintText').style.display = mode === 'day' ? '' : 'none';
      if (mode === 'week' && currentFilter !== 'ALL') {
        weekSelectedEq = currentFilter;
      }
      renderCalendar();
    }

    function changeDate(diff) {
      const next = new Date(currentDate);
      if (viewMode === 'day') next.setDate(next.getDate() + diff);
      else next.setDate(next.getDate() + diff * 7);

      currentDate = clampToAllowedDate(next);
      miniCalDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
      hasScrolledInitialToday = true;
      renderMiniCalendar();
      renderCalendar();
    }

    function goToday() {
      currentDate = new Date();
      miniCalDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
      hasScrolledInitialToday = false;
      renderMiniCalendar();
      renderCalendar();
    }

    function updatePrevButtonsState() {
      const minStr = getMinAllowedDateStr();
      let isAtMin = false;
      if (viewMode === 'day') {
        isAtMin = formatDateStr(currentDate) <= minStr;
      } else {
        const weekStart = new Date(currentDate);
        weekStart.setDate(weekStart.getDate() - weekStart.getDay());
        isAtMin = formatDateStr(weekStart) <= minStr;
      }
      const navBtn = document.getElementById('navPrevBtn');
      const sideBtn = document.getElementById('sidePrevBtn');
      if (navBtn) navBtn.disabled = isAtMin;
      if (sideBtn) sideBtn.disabled = isAtMin;
    }

    function toggleTagBar() {
      document.getElementById('tagBar').classList.toggle('force-hidden');
    }

    function renderTagButtons() {
      const box = document.getElementById('tagButtonsContainer');
      box.innerHTML = '';
      const favSetT = new Set(getFavorites());
      orderedEquipments().forEach(eq => {
        const i = equipments.indexOf(eq);
        const b = document.createElement('button');
        b.className = `px-2.5 py-1 rounded text-xs font-medium text-white ${tagColors[i % tagColors.length]} hover:opacity-90`;
        const info = getEqStatusInfo(eq);
        b.textContent = (favSetT.has(eq) ? '★ ' : '') + (info ? `${eq} [${info.label}]` : eq);
        if (info) b.classList.add('line-through', 'opacity-70');
        b.onclick = () => filterByEquipment(eq);
        box.appendChild(b);
      });
    }

    function filterByEquipment(eq) {
      currentFilter = eq;
      if (viewMode === 'week') weekSelectedEq = eq === 'ALL' ? null : eq;
      renderCalendar();
    }

    function renderCalendar() {
      updatePrevButtonsState();
      const y = currentDate.getFullYear();
      const m = currentDate.getMonth() + 1;
      const d = currentDate.getDate();
      const label = document.getElementById('currentDateLabel');
      const container = document.getElementById('calendarContainer');
      const eqs = currentFilter === 'ALL' ? orderedEquipments() : [currentFilter];

      if (viewMode === 'day') {
        const wd = t('weekdays')[currentDate.getDay()];
        label.textContent = currentLang === 'en'
          ? currentDate.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })
          : `${y}年${m}月${d}日 (${wd})`;
        renderDayTimeline(container, eqs, formatDateStr(currentDate));
      } else {
        const start = new Date(currentDate);
        start.setDate(start.getDate() - start.getDay());
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        label.textContent = currentLang === 'en'
          ? `${start.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })} – ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`
          : `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日 〜 ${end.getMonth()+1}月${end.getDate()}日`;
        renderWeekView(container);
      }
    }

    function fitReservationBarFonts() {
      document.querySelectorAll('.res-bar').forEach(bar => {
        const labelEl = bar.querySelector('.res-label');
        if (!labelEl) return;

        bar.style.paddingLeft = '5px';
        bar.style.paddingRight = '5px';
        labelEl.style.fontSize = '12px';

        const barWidth = bar.clientWidth;
        if (barWidth <= 0) return;

        if (barWidth < 54) {
          bar.style.paddingLeft = '2px';
          bar.style.paddingRight = '2px';
        }

        const availableWidth = bar.clientWidth - (barWidth < 54 ? 4 : 10);
        const textWidth = labelEl.scrollWidth;

        if (textWidth > availableWidth && availableWidth > 0) {
          const ratio = availableWidth / textWidth;
          const fittedSize = Math.max(8, Math.min(11.5, Math.floor(12 * ratio * 10) / 10));
          labelEl.style.fontSize = `${fittedSize}px`;
        }
      });
    }

    // 日表示タイムライン（日をまたぐ予約・24:00終了・現在時刻の線・自分の予約の強調に対応）
    function renderDayTimeline(container, eqs, dateStr) {
      const isTodayView = dateStr === formatDateStr(new Date());
      let html = `<div id="timelineWrapper" class="min-w-[1893px] md:min-w-[1958px] relative">`;
      html += `<div class="timeline-grid bg-slate-100 border-b border-slate-300 text-xs font-bold text-slate-600 sticky top-0 z-30">`;
      html += `<div class="p-2.5 border-r border-slate-300 sticky left-0 bg-slate-100 z-40 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.12)]">${escapeHtml(t('eqColHeader'))}</div>`;
      for (let h = 0; h < 24; h++) {
        html += `<div class="p-2 border-r border-slate-200 text-center">${h}</div>`;
      }
      // 現在時刻のラベル（見出し行の中に表示）
      if (isTodayView) {
        html += `<div class="absolute inset-y-0 left-[165px] md:left-[230px] right-0 pointer-events-none z-[35]"><span class="now-pill" data-now="x" data-date="${dateStr}"></span></div>`;
      }
      html += `</div>`;

      const favSet = new Set(getFavorites());
      const lastFavIdx = eqs.reduce((acc, e, i) => favSet.has(e) ? i : acc, -1);
      eqs.forEach((eq, rowIdx) => {
        const fav = favSet.has(eq);
        // お気に入りの最後の行の下に区切り線（お気に入り以外の機器が続く場合）
        const rowBorder = (rowIdx === lastFavIdx && rowIdx < eqs.length - 1) ? 'border-b-2 border-b-amber-300' : 'border-b border-slate-200';
        // この日にかかる予約（日をまたぐ予約も含む。翌日0:00終了の予約は翌日には出さない）
        const dayItems = reservations
          .filter(r => r.equipment === eq)
          .map(r => ({ item: r, seg: segmentOnDay(r, dateStr) }))
          .filter(x => x.seg);

        const stInfo = getEqStatusInfo(eq);
        const unav = !!stInfo;
        const safeEqAttr = escapeHtml(eq);

        html += `<div data-eq-row="${rowIdx}" data-eq-name="${safeEqAttr}" data-eq-unav="${unav ? '1' : '0'}" class="eq-timeline-row timeline-grid ${rowBorder} ${unav ? 'bg-slate-100/80' : fav ? 'bg-amber-50/40 hover:bg-amber-50/70' : 'hover:bg-slate-50/70'} relative h-11">`;
        html += `<div class="px-2 py-1.5 border-r border-slate-300 text-xs font-semibold sticky left-0 ${unav ? 'bg-slate-100' : fav ? 'bg-amber-50' : 'bg-white'} z-20 flex items-center justify-between gap-1 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]" title="${safeEqAttr}${stInfo && stInfo.note ? ' (' + escapeHtml(stInfo.note) + ')' : ''}">
          <span class="flex items-center gap-1 min-w-0">${favButtonHtml(eq)}<span class="truncate ${unav ? 'text-slate-400 line-through' : ''}">${safeEqAttr}</span></span>
          ${statusBadgeHtml(eq)}
        </div>`;

        for (let h = 0; h < 24; h++) {
          html += `<div class="border-r border-slate-100 h-full pointer-events-none"></div>`;
        }

        // 機器名は data 属性から読む（名前に記号が入っていても壊れないように）
        html += `<div class="timeline-track absolute top-0 bottom-0 left-[165px] md:left-[230px] right-0 ${unav ? 'cursor-not-allowed' : 'cursor-crosshair'} z-10 overflow-hidden"
          ${unav ? '' : `onmousedown="startCreateDrag(event, this.closest('.eq-timeline-row').dataset.eqName, '${dateStr}')" ontouchstart="handleTrackTouchStart(event, this.closest('.eq-timeline-row').dataset.eqName, '${dateStr}')"`}>`;

        dayItems.forEach(({ item, seg }) => {
          const startMin = seg.s;
          const endMin = Math.min(1440, Math.max(seg.s + 15, seg.e));
          const leftPct = (startMin / 1440) * 100;
          const widthPct = ((endMin - startMin) / 1440) * 100;
          const rawText = item.notes ? `${item.title} | ${item.notes}` : item.title;
          const mine = isMyBooking(item);
          const multi = isMultiDay(item);

          // 自分の予約：緑の塗りつぶし＋白文字＋人型アイコン ／ 他の人：白地に青枠
          const barCls = mine
            ? "bg-emerald-600 border-emerald-700 hover:bg-emerald-700 text-white ring-2 ring-emerald-200"
            : "bg-white border-indigo-400 hover:bg-indigo-50 text-slate-800";
          const iconCls = mine ? 'text-emerald-100' : 'text-indigo-500';
          const tip = `${rangeLabel(item)}  ${rawText}${mine ? '  ★' + t('yourBooking') : ''}  (${t(multi ? 'clickEdit' : 'clickEditDrag')})`;

          html += `<div data-res-id="${escapeHtml(item.id)}"
            onmousedown="startMoveDrag(event, this.dataset.resId)"
            ontouchstart="handleBarTouchStart(event, this.dataset.resId)"
            title="${escapeHtml(tip)}"
            style="left:${leftPct}%; width:${widthPct}%;"
            class="res-bar absolute top-1.5 bottom-1.5 border-2 rounded px-1.5 text-xs font-bold flex items-center overflow-hidden shadow-sm cursor-pointer z-10 ${barCls}">
            ${seg.startsBefore ? `<i class="fa-solid fa-caret-left text-[10px] ${iconCls} mr-0.5 shrink-0"></i>` : ''}${mine ? '<i class="fa-solid fa-user text-[9px] mr-1 shrink-0"></i>' : ''}${item.seriesId ? `<i class="fa-solid fa-rotate text-[9px] ${iconCls} mr-0.5 shrink-0"></i>` : ''}<span class="res-label whitespace-nowrap overflow-hidden leading-none">${escapeHtml(rawText)}</span>${seg.endsAfter ? `<i class="fa-solid fa-caret-right text-[10px] ${iconCls} ml-auto pl-0.5 shrink-0"></i>` : ''}
          </div>`;
        });

        html += `</div></div>`;
      });

      // 現在時刻の縦線（予約バーの上・機器名の列の下に重ねる）
      if (isTodayView) {
        html += `<div class="absolute top-0 bottom-0 left-[165px] md:left-[230px] right-0 pointer-events-none z-[15]"><div class="now-line" data-now="x" data-date="${dateStr}"></div></div>`;
      }
      html += `<div id="createGhostBar" class="force-hidden pointer-events-none absolute bg-indigo-500/35 border-2 border-dashed border-indigo-700 rounded z-[25] flex items-center justify-center text-[11px] font-bold text-indigo-950 shadow-md"></div>`;
      html += `</div>`;
      container.innerHTML = html;
      updateNowIndicators();

      requestAnimationFrame(() => {
        fitReservationBarFonts();

        // 今日を開いたときは現在時刻の1時間前から、別の日は午前10時から表示
        let targetMinutes = 600;
        if (isTodayView && !hasScrolledInitialToday) {
          const now = new Date();
          targetMinutes = Math.max(0, now.getHours() * 60 + now.getMinutes() - 60);
        }
        const wrapper = document.getElementById('calendarContainer');
        if (wrapper) {
          const leftColWidth = window.innerWidth >= 768 ? 230 : 165;
          const scrollableWidth = wrapper.scrollWidth - leftColWidth;
          wrapper.scrollLeft = Math.max(0, (targetMinutes / 1440) * scrollableWidth);
        }
      });
    }

    function clientXToMinutes(trackEl, clientX) {
      const rect = trackEl.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const rawMins = ratio * 1440;
      return Math.round(rawMins / 15) * 15;
    }

    function initCreateDragState(trackEl, eq, dateStr, clientX, isTouch = false) {
      if (isEqUnavailable(eq)) return;
      const startMin = clientXToMinutes(trackEl, clientX);
      const rowEl = trackEl.closest('.eq-timeline-row');
      const wrapperEl = document.getElementById('timelineWrapper');
      const rowRect = rowEl.getBoundingClientRect();
      const wrapRect = wrapperEl.getBoundingClientRect();

      dragState = {
        mode: 'create',
        isTouch,
        eq,
        dateStr,
        trackEl,
        startX: clientX,
        startMin,
        currMin: startMin,
        moved: false,
        topPx: rowRect.top - wrapRect.top + 3,
        heightPx: rowRect.height - 6
      };

      const ghost = document.getElementById('createGhostBar');
      ghost.style.top = `${dragState.topPx}px`;
      ghost.style.height = `${dragState.heightPx}px`;
      updateCreateGhost();
      showEl('createGhostBar');
    }

    function initMoveDragState(barEl, resId, clientX, clientY, isTouch = false) {
      const item = reservations.find(r => String(r.id) === String(resId));
      if (!item) return false;

      const trackEl = barEl.closest('.timeline-track');
      const startMin = timeToMinutes(item.startTime);
      // 24:00終了（翌日0:00）にも対応するため通算の分で長さを求める
      const duration = Math.max(15, absEndMin(item) - absStartMin(item));
      const pointerOffsetMin = clientXToMinutes(trackEl, clientX) - startMin;
      const locked = isMultiDay(item); // 日をまたぐ予約はドラッグ移動不可（編集画面で変更）

      dragState = {
        mode: 'move',
        isTouch,
        locked,
        resId: String(resId),
        item,
        barEl,
        trackEl,
        startX: clientX,
        startY: clientY,
        duration,
        pointerOffsetMin,
        newStartMin: startMin,
        targetEq: item.equipment,
        moved: isTouch && !locked
      };

      if (isTouch && !locked) barEl.classList.add('dragging');
      return true;
    }

    function handleDragMove(clientX, clientY) {
      if (!dragState) return;

      if (dragState.mode === 'create') {
        if (Math.abs(clientX - dragState.startX) >= 8) dragState.moved = true;
        dragState.currMin = clientXToMinutes(dragState.trackEl, clientX);
        updateCreateGhost();
      } else if (dragState.mode === 'move') {
        if (dragState.locked) return;
        const dx = Math.abs(clientX - dragState.startX);
        const dy = Math.abs(clientY - dragState.startY);
        if (!dragState.moved && dx < 10 && dy < 10) return;

        dragState.moved = true;
        dragState.barEl.classList.add('dragging');

        const pointerMin = clientXToMinutes(dragState.trackEl, clientX);
        let newStart = Math.round((pointerMin - dragState.pointerOffsetMin) / 15) * 15;
        newStart = Math.max(0, Math.min(1440 - dragState.duration, newStart));
        dragState.newStartMin = newStart;

        dragState.barEl.style.left = `${(newStart / 1440) * 100}%`;

        document.querySelectorAll('.eq-timeline-row').forEach(row => {
          const rect = row.getBoundingClientRect();
          if (clientY >= rect.top && clientY <= rect.bottom && row.getAttribute('data-eq-unav') !== '1') {
            dragState.targetEq = row.dataset.eqName;
            row.classList.add('bg-indigo-100/70');
            const targetTrack = row.querySelector('.timeline-track');
            if (targetTrack && dragState.barEl.parentElement !== targetTrack) {
              targetTrack.appendChild(dragState.barEl);
            }
          } else {
            row.classList.remove('bg-indigo-100/70');
          }
        });
      }
    }

    function finishDragOperation() {
      if (!dragState) return;

      if (dragState.mode === 'create') {
        hideEl('createGhostBar');
        // 開始は最大23:45、終了は最大24:00（右端をクリックしても開始＞終了にならないように）
        const s = Math.min(1425, Math.min(dragState.startMin, dragState.currMin));
        const e = dragState.moved
          ? Math.min(1440, Math.max(s + 15, Math.max(dragState.startMin, dragState.currMin)))
          : Math.min(1440, s + 60);

        const { eq, dateStr } = dragState;
        dragState = null;
        openNewModal(eq, dateStr, minutesToTime(s), e >= 1440 ? '24:00' : minutesToTime(e));
      } else if (dragState.mode === 'move') {
        const { resId, item, barEl, moved, locked, newStartMin, duration, targetEq } = dragState;
        barEl.classList.remove('dragging');
        document.querySelectorAll('.eq-timeline-row').forEach(r => r.classList.remove('bg-indigo-100/70'));
        dragState = null;

        if (!moved || locked) {
          openEditModal(resId);
          return;
        }

        const newStStr = minutesToTime(newStartMin);
        const newEndMin = newStartMin + duration;
        // 24:00 に終わる場合は「翌日 0:00」として保存する
        const newEtStr = newEndMin >= 1440 ? "00:00" : minutesToTime(newEndMin);
        const newEndDate = newEndMin >= 1440 ? addDaysStr(item.date, 1) : item.date;

        if (targetEq === item.equipment && newStStr === item.startTime && newEtStr === item.endTime && newEndDate === resEndDate(item)) {
          renderCalendar();
          return;
        }

        if (targetEq !== item.equipment && isEqUnavailable(targetEq)) {
          const info = getEqStatusInfo(targetEq);
          alert(t('eqUnavailableAlert', { eq: targetEq, status: info ? info.label : '' }));
          renderCalendar();
          return;
        }

        // 自分自身との重なりは除外して判定
        if (hasConflict(targetEq, item.date, newEndDate, newStStr, newEtStr, { [resId]: true })) {
          alert(t('moveConflict'));
          renderCalendar();
          return;
        }

        openMoveConfirmModal(item, {
          ...item,
          equipment: targetEq,
          startTime: newStStr,
          endTime: newEtStr,
          endDate: newEndDate
        });
      }
    }

    function startCreateDrag(e, eq, dateStr) {
      if (e.button !== 0 || isSyncing) return;
      initCreateDragState(e.currentTarget, eq, dateStr, e.clientX, false);
    }

    function startMoveDrag(e, resId) {
      e.stopPropagation();
      if (e.button !== 0 || isSyncing) return;
      initMoveDragState(e.currentTarget, resId, e.clientX, e.clientY, false);
    }

    function updateCreateGhost() {
      if (!dragState || dragState.mode !== 'create') return;
      const ghost = document.getElementById('createGhostBar');
      const trackRect = dragState.trackEl.getBoundingClientRect();
      const wrapRect = document.getElementById('timelineWrapper').getBoundingClientRect();
      const trackLeftOffset = trackRect.left - wrapRect.left;

      const s = Math.min(1425, Math.min(dragState.startMin, dragState.currMin));
      const e = Math.min(1440, Math.max(s + 15, Math.max(dragState.startMin, dragState.currMin)));
      const leftPx = trackLeftOffset + (s / 1440) * trackRect.width;
      const widthPx = ((e - s) / 1440) * trackRect.width;

      ghost.style.left = `${leftPx}px`;
      ghost.style.width = `${Math.max(20, widthPx)}px`;
      ghost.textContent = `${minutesToTime(s)} - ${e >= 1440 ? '24:00' : minutesToTime(e)}`;
    }

    window.addEventListener('mousemove', (e) => {
      if (!dragState || dragState.isTouch) return;
      handleDragMove(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => {
      if (!dragState || dragState.isTouch) return;
      finishDragOperation();
    });

    function cancelTouchHoldTimer() {
      if (touchHoldState && touchHoldState.timer) clearTimeout(touchHoldState.timer);
      touchHoldState = null;
    }

    function handleTrackTouchStart(e, eq, dateStr) {
      if (isSyncing || e.touches.length !== 1 || isEqUnavailable(eq)) return;
      cancelTouchHoldTimer();
      const touch = e.touches[0];
      const trackEl = e.currentTarget;
      const startX = touch.clientX;
      const startY = touch.clientY;

      const timer = setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate(25);
        initCreateDragState(trackEl, eq, dateStr, startX, true);
        touchHoldState = null;
      }, 350);

      touchHoldState = { type: 'create', timer, startX, startY };
    }

    function handleBarTouchStart(e, resId) {
      e.stopPropagation();
      if (isSyncing || e.touches.length !== 1) return;
      cancelTouchHoldTimer();
      const touch = e.touches[0];
      const barEl = e.currentTarget;
      const startX = touch.clientX;
      const startY = touch.clientY;

      const timer = setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate(25);
        initMoveDragState(barEl, resId, startX, startY, true);
        touchHoldState = null;
      }, 350);

      touchHoldState = { type: 'move', resId, timer, startX, startY };
    }

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      const touch = e.touches[0];

      if (touchHoldState) {
        const dx = Math.abs(touch.clientX - touchHoldState.startX);
        const dy = Math.abs(touch.clientY - touchHoldState.startY);
        if (dx > 10 || dy > 10) cancelTouchHoldTimer();
        return;
      }

      if (dragState && dragState.isTouch) {
        if (e.cancelable) e.preventDefault();
        handleDragMove(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (touchHoldState) {
        const prevHold = touchHoldState;
        cancelTouchHoldTimer();
        if (prevHold.type === 'move' && prevHold.resId) {
          if (e.cancelable) e.preventDefault();
          openEditModal(prevHold.resId);
        }
        return;
      }

      if (dragState && dragState.isTouch) {
        if (e.cancelable) e.preventDefault();
        finishDragOperation();
      }
    });

    window.addEventListener('touchcancel', () => {
      cancelTouchHoldTimer();
      if (dragState && dragState.isTouch) {
        hideEl('createGhostBar');
        if (dragState.barEl) dragState.barEl.classList.remove('dragging');
        document.querySelectorAll('.eq-timeline-row').forEach(r => r.classList.remove('bg-indigo-100/70'));
        dragState = null;
        renderCalendar();
      }
    });

    // ドラッグ移動確認モーダル（変更後の機器・時刻はここで微調整できる。他人予約の場合は強い警告を表示）
    let pendingMoveOrig = null;

    function openMoveConfirmModal(beforeItem, afterItem) {
      pendingMoveData = afterItem;
      pendingMoveOrig = beforeItem;
      const noteText = beforeItem.notes ? ` (${beforeItem.notes})` : "";
      document.getElementById('confirmMoveTitle').textContent = `${beforeItem.title}${noteText}`;
      document.getElementById('confirmMoveBefore').textContent = `${beforeItem.equipment} ｜ ${rangeLabel(beforeItem)}`;

      // 変更後の欄にドラッグ結果を入れる（終了が翌日0:00なら「0:00」＝その日の24:00）
      document.getElementById('moveEqSelect').innerHTML = buildEquipmentOptions(afterItem.equipment, beforeItem.equipment);
      document.getElementById('moveStartTime').value = afterItem.startTime;
      document.getElementById('moveEndTime').value = afterItem.endTime;
      document.getElementById('moveDateNote').textContent = t('moveDateNote', { date: shortDateLabel(afterItem.date) });
      validateMoveForm();

      if (!isMyBooking(beforeItem)) {
        document.getElementById('moveOtherWarningText').textContent = t('otherWarnPrefix', { name: beforeItem.title });
        showEl('moveOtherWarning');
      } else {
        hideEl('moveOtherWarning');
      }
      showEl('moveConfirmModal');
    }

    // 移動確認画面の入力を読み取って確認する。問題があれば { error }、なければ { item } を返す
    function readMoveForm() {
      const base = pendingMoveData;
      const orig = pendingMoveOrig;
      if (!base || !orig) return { error: t('opFailed') };
      const stRaw = document.getElementById('moveStartTime').value;
      const etRaw = document.getElementById('moveEndTime').value;
      if (!stRaw || !etRaw) return { error: t('dateRequired') };
      const eq = document.getElementById('moveEqSelect').value;
      const startTime = cleanTime(stRaw);
      const endTime = cleanTime(etRaw);
      // 終了 0:00 は「その日の24:00」＝翌日0:00として保存
      const endDate = endTime === "00:00" ? addDaysStr(base.date, 1) : base.date;
      const item = { ...base, equipment: eq, startTime, endTime, endDate };
      if (absEndMin(item) <= absStartMin(item)) return { error: t('endAfterStart') };
      if (eq !== orig.equipment && isEqUnavailable(eq)) {
        const info = getEqStatusInfo(eq);
        return { error: t('eqUnavailableAlert', { eq, status: info ? info.label : '' }) };
      }
      if (hasConflict(eq, item.date, endDate, startTime, endTime, { [item.id]: true })) return { error: t('conflictSame') };
      return { item };
    }

    // 入力が変わるたびに確認し、問題があればその場で表示して「変更する」を押せなくする
    function validateMoveForm() {
      const r = readMoveForm();
      const errEl = document.getElementById('moveFormError');
      if (r.error) {
        errEl.textContent = r.error;
        showEl('moveFormError');
      } else {
        hideEl('moveFormError');
      }
      document.getElementById('confirmMoveBtn').disabled = !!r.error;
      return r;
    }

    function cancelPendingMove() {
      pendingMoveData = null;
      pendingMoveOrig = null;
      hideEl('moveConfirmModal');
      renderCalendar();
    }

    async function executePendingMove() {
      if (!pendingMoveData || isSyncing) return;
      const r = validateMoveForm();
      if (r.error) return;
      const updatedItem = r.item;
      pendingMoveData = null;
      pendingMoveOrig = null;

      const btn = document.getElementById('confirmMoveBtn');
      btn.disabled = true;

      try {
        hideEl('moveConfirmModal');
        // 失敗したときは sendTransaction が手元のデータで描き直すので、バーは元の位置に戻る
        const res = await sendTransaction({ action: "update", item: updatedItem });
        notifyFailure(res, t('opFailed'));
      } finally {
        btn.disabled = false;
      }
    }

    // 週表示
    function selectWeekEquipment(eq) {
      weekSelectedEq = eq || null;
      renderCalendar();
    }

    function stepWeekEquipment(delta) {
      const list = orderedEquipments();
      if (!weekSelectedEq || list.length === 0) return;
      const idx = list.indexOf(weekSelectedEq);
      const nextIdx = (idx + delta + list.length) % list.length;
      weekSelectedEq = list[nextIdx];
      renderCalendar();
    }

    function updateWeekSearch(val) {
      weekSearchQuery = val;
      renderCalendar();
      const inp = document.getElementById('weekEqSearchInput');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }

    function renderWeekView(container) {
      if (!weekSelectedEq || !equipments.includes(weekSelectedEq)) {
        const filtered = orderedEquipments().filter(eq => eq.toLowerCase().includes(weekSearchQuery.toLowerCase()));
        const favSetW = new Set(getFavorites());
        let html = `<div class="p-6 max-w-5xl mx-auto">`;
        html += `<div class="text-center mb-6">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 text-xl mb-2">
            <i class="fa-solid fa-calendar-week"></i>
          </div>
          <h2 class="text-lg font-bold text-slate-800">${escapeHtml(t('weekSelectTitle'))}</h2>
          <p class="text-xs text-slate-500 mt-1">${escapeHtml(t('weekSelectDesc'))}</p>
        </div>`;

        html += `<div class="max-w-md mx-auto mb-5 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input id="weekEqSearchInput" type="text" value="${escapeHtml(weekSearchQuery)}"
            oninput="updateWeekSearch(this.value)"
            placeholder="${escapeHtml(t('weekSearchPlaceholder'))}"
            class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>`;

        html += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">`;
        filtered.forEach((eq) => {
          const origIdx = equipments.indexOf(eq);
          const colorCls = tagColors[origIdx % tagColors.length];
          const favW = favSetW.has(eq);
          html += `<div data-eq="${escapeHtml(eq)}" role="button" tabindex="0" onclick="selectWeekEquipment(this.dataset.eq)"
            class="flex items-center gap-3 p-3 rounded-xl border ${favW ? 'border-amber-300 bg-amber-50/60' : 'border-slate-200'} hover:border-indigo-500 hover:bg-indigo-50/50 text-left transition shadow-sm group cursor-pointer">
            ${favButtonHtml(eq, 'text-lg')}
            <span class="w-3 h-8 rounded-full ${colorCls} shrink-0"></span>
            <span class="text-sm font-bold text-slate-800 group-hover:text-indigo-700 truncate flex-1">${escapeHtml(eq)}</span>
            ${statusBadgeHtml(eq)}
          </div>`;
        });
        html += `</div></div>`;
        container.innerHTML = html;
        return;
      }

      const eqIdx = equipments.indexOf(weekSelectedEq);
      const badgeColor = tagColors[eqIdx % tagColors.length];
      const stInfo = getEqStatusInfo(weekSelectedEq);
      const unav = !!stInfo;

      const start = new Date(currentDate);
      start.setDate(start.getDate() - start.getDay());
      const days = [];
      const wNames = t('weekdays');
      const todayStr = formatDateStr(new Date());
      const minStr = getMinAllowedDateStr();

      for (let i = 0; i < 7; i++) {
        const dt = new Date(start);
        dt.setDate(start.getDate() + i);
        const s = formatDateStr(dt);
        days.push({ str: s, label: `${dt.getMonth() + 1}/${dt.getDate()} (${wNames[i]})`, dow: i, disabled: s < minStr });
      }

      let html = `<div class="bg-indigo-50/80 border-b border-indigo-200 px-4 py-3 flex flex-wrap items-center justify-between gap-3 sticky left-0">`;
      html += `<div class="flex items-center gap-2.5 flex-wrap">
        <span class="px-2.5 py-1 rounded-md text-xs font-bold text-white ${badgeColor}">${escapeHtml(t('weekShowing'))}</span>
        ${favButtonHtml(weekSelectedEq, 'text-xl')}
        <span class="text-base sm:text-lg font-extrabold text-indigo-950">${escapeHtml(weekSelectedEq)}</span>
        ${stInfo ? `<span class="text-xs px-2 py-0.5 rounded border font-bold ${stInfo.cls}">${escapeHtml(stInfo.label)}${stInfo.note ? ' : ' + escapeHtml(stInfo.note) : ''}</span>` : ''}
      </div>`;

      html += `<div class="flex flex-wrap items-center gap-2">
        <button onclick="stepWeekEquipment(-1)" class="px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-bold hover:bg-slate-50">
          <i class="fa-solid fa-chevron-left"></i> ${escapeHtml(t('weekPrevEq'))}
        </button>
        <select onchange="selectWeekEquipment(this.value)" class="border border-indigo-300 bg-white rounded-lg px-3 py-1.5 text-xs sm:text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500">
          ${buildEquipmentOptions(weekSelectedEq, '*')}
        </select>
        <button onclick="stepWeekEquipment(1)" class="px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-bold hover:bg-slate-50">
          ${escapeHtml(t('weekNextEq'))} <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button onclick="selectWeekEquipment(null)" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-lg text-xs font-bold ml-1">
          <i class="fa-solid fa-table-cells-large mr-1"></i>${escapeHtml(t('weekBackList'))}
        </button>
      </div></div>`;

      const hourHeight = WEEK_HOUR_HEIGHT;
      html += `<div class="min-w-[860px]">`;
      html += `<div class="week-grid bg-slate-100 border-b border-slate-300 text-xs font-bold text-center sticky top-0 z-20">`;
      html += `<div class="p-2.5 border-r border-slate-300 text-slate-500">${escapeHtml(t('weekTimeCol'))}</div>`;
      days.forEach(d => {
        const isToday = d.str === todayStr;
        const color = d.disabled ? 'text-slate-300' : d.dow === 0 ? 'text-red-600' : d.dow === 6 ? 'text-blue-600' : 'text-slate-700';
        html += `<div class="p-2.5 border-r border-slate-200 ${isToday ? 'bg-indigo-100/80 text-indigo-900' : color}">
          ${escapeHtml(d.label)} ${isToday ? `<span class="ml-1 text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded">${escapeHtml(t('weekTodayBadge'))}</span>` : ''}
        </div>`;
      });
      html += `</div>`;

      html += `<div class="week-grid relative">`;
      html += `<div class="border-r border-slate-300 bg-slate-50">`;
      for (let h = 0; h < 24; h++) {
        html += `<div style="height:${hourHeight}px;" class="border-b border-slate-200 text-[11px] text-slate-500 font-medium pr-2 flex items-start justify-end pt-0.5">${h}:00</div>`;
      }
      html += `</div>`;

      const safeWeekEq = escapeHtml(weekSelectedEq);
      days.forEach(d => {
        // この日にかかる予約（日をまたぐ予約も含む）
        const dayItems = d.disabled ? [] : reservations
          .filter(r => r.equipment === weekSelectedEq)
          .map(r => ({ item: r, seg: segmentOnDay(r, d.str) }))
          .filter(x => x.seg);
        const canClick = !d.disabled && !unav;

        html += `<div class="border-r border-slate-200 relative ${d.disabled || unav ? 'bg-slate-100/70' : d.str === todayStr ? 'bg-indigo-50/20' : ''}">`;
        for (let h = 0; h < 24; h++) {
          const tStr = `${String(h).padStart(2, '0')}:00`;
          const eStr = h === 23 ? '24:00' : `${String(h + 1).padStart(2, '0')}:00`;
          html += `<div data-eq="${safeWeekEq}" ${canClick ? `onclick="openNewModal(this.dataset.eq, '${d.str}', '${tStr}', '${eStr}')"` : ''}
            style="height:${hourHeight}px;"
            class="border-b border-slate-100 ${canClick ? 'hover:bg-indigo-50/70 cursor-pointer' : ''}"></div>`;
        }

        dayItems.forEach(({ item, seg }) => {
          const startMin = seg.s;
          const endMin = Math.min(1440, Math.max(startMin + 15, seg.e));
          const durationMin = endMin - startMin;
          const topPx = (startMin / 60) * hourHeight;
          const heightPx = Math.max(16, (durationMin / 60) * hourHeight);
          const fontSizeClass = durationMin <= 30 ? 'text-[9px]' : durationMin <= 45 ? 'text-[10px]' : 'text-[11px]';
          const mine = isMyBooking(item);
          // 自分の予約：緑の塗りつぶし＋白文字＋人型アイコン ／ 他の人：薄い青
          const weekBarCls = mine
            ? "bg-emerald-600 hover:bg-emerald-700 border-emerald-800 text-white ring-2 ring-emerald-200"
            : "bg-indigo-50 hover:bg-indigo-100 border-indigo-300 text-indigo-950";
          const timeText = `${seg.startsBefore ? '▲' : ''}${item.startTime}-${endTimeLabel(item)}${seg.endsAfter ? '▼' : ''}`;
          const tip = `${rangeLabel(item)}  ${item.title}${item.notes ? ' | ' + item.notes : ''}${mine ? '  ★' + t('yourBooking') : ''}`;

          html += `<div data-res-id="${escapeHtml(item.id)}" onclick="event.stopPropagation(); openEditModal(this.dataset.resId)"
            style="top:${topPx}px; height:${heightPx}px;"
            title="${escapeHtml(tip)}"
            class="absolute left-1 right-1 ${weekBarCls} rounded-md px-1.5 py-0.5 ${fontSizeClass} shadow-sm cursor-pointer overflow-hidden flex flex-col justify-center border z-10">
            <div class="font-bold leading-tight whitespace-nowrap overflow-hidden">${mine ? '<i class="fa-solid fa-user text-[8px] mr-1"></i>' : ''}${escapeHtml(timeText)} ${escapeHtml(item.title)}</div>
            ${item.notes && heightPx >= 32 ? `<div class="text-[9.5px] ${mine ? 'text-emerald-50' : 'text-indigo-700'} whitespace-nowrap overflow-hidden">${escapeHtml(item.notes)}</div>` : ''}
          </div>`;
        });

        // 今日の列に現在時刻の横線
        if (d.str === todayStr) {
          html += `<div class="now-line-h" data-now="y" data-date="${d.str}"></div>`;
        }
        html += `</div>`;
      });

      html += `</div></div>`;
      container.innerHTML = html;
      updateNowIndicators();
    }

    // 開始日時変更時の30分自動連動
    function handleStartDateChange() {
      const sDateEl = document.getElementById('modalStartDate');
      const eDateEl = document.getElementById('modalEndDate');
      if (sDateEl && eDateEl && eDateEl.value < sDateEl.value) {
        eDateEl.value = sDateEl.value;
      }
      handleStartTimeChange();
    }

    function handleStartTimeChange() {
      const sDateEl = document.getElementById('modalStartDate');
      const eDateEl = document.getElementById('modalEndDate');
      const stEl = document.getElementById('modalStartTime');
      const etEl = document.getElementById('modalEndTime');
      if (!stEl || !etEl || !stEl.value) return;

      const [h, m] = stEl.value.split(':').map(Number);
      let totalMins = h * 60 + m + 30;
      let nextDayAdd = 0;
      if (totalMins >= 1440) {
        totalMins -= 1440;
        nextDayAdd = 1;
      }
      const newEtStr = `${String(Math.floor(totalMins / 60)).padStart(2, '0')}:${String(totalMins % 60).padStart(2, '0')}`;

      if (sDateEl && eDateEl && sDateEl.value === eDateEl.value) {
        if (!etEl.value || etEl.value <= stEl.value) {
          etEl.value = newEtStr;
          if (nextDayAdd > 0) {
            const dt = new Date(sDateEl.value + "T00:00:00");
            dt.setDate(dt.getDate() + 1);
            eDateEl.value = formatDateStr(dt);
          }
        }
      }
    }

    // ワンクリック延長（+30分）
    function quickExtend30() {
      const eDateEl = document.getElementById('modalEndDate');
      const etEl = document.getElementById('modalEndTime');
      if (!eDateEl || !etEl || !etEl.value) return;

      const [h, m] = etEl.value.split(':').map(Number);
      let total = h * 60 + m + 30;
      if (total >= 1440) {
        total -= 1440;
        const dt = new Date(eDateEl.value + "T00:00:00");
        dt.setDate(dt.getDate() + 1);
        eDateEl.value = formatDateStr(dt);
      }
      etEl.value = `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }

    // ワンクリック早期終了（現在時刻で切り上げ）
    function quickFinishNow() {
      const now = new Date();
      const todayStr = formatDateStr(now);
      const nowTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('modalEndDate').value = todayStr;
      document.getElementById('modalEndTime').value = nowTime;
    }

    // モーダル操作
    // 機器の選択肢（予約不可の機器は選べない。リストから消えた機器の予約も編集できるよう残す）
    function buildEquipmentOptions(selectedEq, allowUnavailableEq = null) {
      const opt = e => {
        const stInfo = getEqStatusInfo(e);
        const disabled = stInfo && allowUnavailableEq !== '*' && e !== allowUnavailableEq ? 'disabled' : '';
        const suffix = stInfo ? ` [${stInfo.label}]` : '';
        return `<option value="${escapeHtml(e)}" ${e === selectedEq ? 'selected' : ''} ${disabled}>${escapeHtml(e + suffix)}</option>`;
      };
      const favs = getFavorites();
      const favList = equipments.filter(e => favs.includes(e));
      const others = equipments.filter(e => !favs.includes(e));
      // リストから消えた機器の予約も編集できるよう、先頭に残す
      const orphan = (selectedEq && !equipments.includes(selectedEq)) ? opt(selectedEq) : '';
      if (favList.length === 0) return orphan + others.map(opt).join('');
      return orphan
        + `<optgroup label="${escapeHtml('★ ' + t('favGroup'))}">${favList.map(opt).join('')}</optgroup>`
        + `<optgroup label="${escapeHtml(t('otherGroup'))}">${others.map(opt).join('')}</optgroup>`;
    }

    function setModalDateLimits() {
      const minStr = getMinAllowedDateStr();
      const maxStr = getMaxFutureDateStr();
      ['modalStartDate', 'modalEndDate'].forEach(id => {
        const el = document.getElementById(id);
        el.min = minStr;
        el.max = maxStr;
      });
    }

    function openNewModal(eq = '', date = '', startTime = '09:00', endTime = '10:00') {
      updateNameSuggestions();
      editingId = null;
      document.getElementById('modalTitle').textContent = t('newBooking');
      hideEl('deleteBtn');
      hideEl('quickActionBtns');
      hideEl('seriesScopeSection');
      hideEl('modalOtherWarning');
      showEl('repeatSection');

      document.getElementById('modalName').value = currentActor || "";
      document.getElementById('modalNotes').value = "";
      document.getElementById('modalRepeatType').value = "none";
      hideEl('repeatCountBox');

      const defaultEq = eq || (viewMode === 'week' && weekSelectedEq ? weekSelectedEq : '');
      document.getElementById('modalEquipment').innerHTML = buildEquipmentOptions(defaultEq, null);

      setModalDateLimits();
      const targetDate = date || formatDateStr(currentDate);
      // "24:00" 終了は「翌日 0:00」として入力欄に入れる
      let et = cleanTime(endTime);
      let endDateVal = targetDate;
      if (et === '24:00') {
        et = '00:00';
        endDateVal = addDaysStr(targetDate, 1);
      }
      document.getElementById('modalStartDate').value = targetDate;
      document.getElementById('modalEndDate').value = endDateVal;
      document.getElementById('modalStartTime').value = cleanTime(startTime);
      document.getElementById('modalEndTime').value = et;
      showEl('bookingModal');
    }

    function openEditModal(id) {
      const item = reservations.find(r => String(r.id) === String(id));
      if (!item) return;
      updateNameSuggestions();
      editingId = String(item.id);
      document.getElementById('modalTitle').textContent = t('editBooking');
      showEl('deleteBtn');
      showEl('quickActionBtns');
      hideEl('repeatSection');

      if (item.seriesId) {
        document.querySelector('input[name="seriesScope"][value="single"]').checked = true;
        showEl('seriesScopeSection');
      } else {
        hideEl('seriesScopeSection');
      }

      if (!isMyBooking(item)) {
        document.getElementById('modalOtherWarningText').textContent = t('otherWarnPrefix', { name: item.title });
        showEl('modalOtherWarning');
      } else {
        hideEl('modalOtherWarning');
      }

      document.getElementById('modalEquipment').innerHTML = buildEquipmentOptions(item.equipment, item.equipment);
      setModalDateLimits();
      document.getElementById('modalStartDate').value = cleanDate(item.date);
      document.getElementById('modalEndDate').value = cleanDate(resEndDate(item));
      document.getElementById('modalName').value = item.title || "";
      document.getElementById('modalStartTime').value = cleanTime(item.startTime);
      document.getElementById('modalEndTime').value = cleanTime(item.endTime);
      document.getElementById('modalNotes').value = item.notes || "";
      showEl('bookingModal');
    }

    function closeBookingModal() {
      hideEl('bookingModal');
    }

    function toggleRepeatOptions() {
      const val = document.getElementById('modalRepeatType').value;
      if (val === 'none') hideEl('repeatCountBox');
      else showEl('repeatCountBox');
    }

    async function saveBooking(e) {
      e.preventDefault();
      if (isSyncing) return;

      const eq = document.getElementById('modalEquipment').value;
      const title = document.getElementById('modalName').value.trim();
      const sDate = document.getElementById('modalStartDate').value;
      const eDate = document.getElementById('modalEndDate').value;
      const startTime = cleanTime(document.getElementById('modalStartTime').value);
      const endTime = cleanTime(document.getElementById('modalEndTime').value);
      const notes = document.getElementById('modalNotes').value.trim();

      // ---- 入力チェック ----
      if (!sDate || !eDate || !document.getElementById('modalStartTime').value || !document.getElementById('modalEndTime').value) {
        alert(t('dateRequired'));
        return;
      }
      const probe = { date: sDate, endDate: eDate, startTime, endTime };
      if (absEndMin(probe) <= absStartMin(probe)) {
        alert(t('endAfterStart'));
        return;
      }
      const span = dayNum(eDate) - dayNum(sDate);
      if (span > MAX_SPAN_DAYS) {
        alert(t('spanTooLong', { n: MAX_SPAN_DAYS }));
        return;
      }
      const minStr = getMinAllowedDateStr();
      const maxStr = getMaxFutureDateStr();
      if (sDate < minStr) {
        alert(t('dateBeforeRetention', { date: minStr }));
        return;
      }
      if (eDate > maxStr) {
        alert(t('dateTooFar', { date: maxStr }));
        return;
      }

      const orig = editingId ? reservations.find(r => String(r.id) === String(editingId)) : null;
      if (editingId && !orig) {
        alert(t('bookingNotFound'));
        return;
      }
      // 故障中などの機器には新規予約・機器の変更ができない
      if (isEqUnavailable(eq) && (!orig || orig.equipment !== eq)) {
        const info = getEqStatusInfo(eq);
        alert(t('eqUnavailableAlert', { eq, status: info ? info.label : '' }));
        return;
      }
      // 他の人の予約を変更するときは確認
      if (orig && !isMyBooking(orig) && !confirm(t('confirmEditOther', { name: orig.title }))) return;

      const btn = document.getElementById('saveSubmitBtn');
      btn.disabled = true;
      btn.textContent = t('btnSaving');

      try {
        if (orig) {
          const scopeEl = document.querySelector('input[name="seriesScope"]:checked');
          const scope = (orig.seriesId && scopeEl) ? scopeEl.value : 'single';
          let res;

          if (scope === 'future') {
            // 繰り返し予約：この日以降すべてをまとめて変更（日付の変更はできない）
            if (sDate !== orig.date) {
              alert(t('seriesDateChange'));
              return;
            }
            res = await sendTransaction({
              action: "updateSeries",
              seriesId: orig.seriesId,
              fromDate: orig.date,
              changes: { equipment: eq, title, notes, spanDays: span, startTime, endTime }
            });
          } else {
            if (hasConflict(eq, sDate, eDate, startTime, endTime, { [orig.id]: true })) {
              alert(t('conflictSame'));
              return;
            }
            res = await sendTransaction({
              action: "update",
              item: { ...orig, equipment: eq, title, date: sDate, endDate: eDate, startTime, endTime, notes }
            });
          }
          if (res.status !== "success") {
            notifyFailure(res, t('opFailed'));
            // 他の人が先に変更していた場合は、最新の内容を確認してもらうため閉じる
            if (res.status === "stale") closeBookingModal();
            return;
          }
          closeBookingModal();
        } else {
          const rep = document.getElementById('modalRepeatType').value;
          const count = rep === 'none' ? 1 : Math.min(30, Math.max(2, parseInt(document.getElementById('modalRepeatCount').value, 10) || 4));
          const seriesId = rep === 'none' ? "" : "ser_" + Date.now();
          const randSuffix = Math.random().toString(36).slice(2, 6);
          const base = new Date(sDate + "T00:00:00");
          const candidateItems = [];

          for (let i = 0; i < count; i++) {
            let dStr;
            if (rep === 'daily') dStr = addDaysStr(sDate, i);
            else if (rep === 'weekly') dStr = addDaysStr(sDate, i * 7);
            else if (rep === 'biweekly') dStr = addDaysStr(sDate, i * 14);
            else if (rep === 'monthly') {
              // 毎月：その月に同じ日がなければ月末にそろえる（1/31 → 2/28 → 3/31 …）
              const y = base.getFullYear();
              const m = base.getMonth() + i;
              const lastDay = new Date(y, m + 1, 0).getDate();
              dStr = formatDateStr(new Date(y, m, Math.min(base.getDate(), lastDay)));
            } else dStr = sDate;

            candidateItems.push({
              id: `res_${Date.now()}_${randSuffix}_${i}`,
              equipment: eq,
              title,
              date: dStr,
              endDate: addDaysStr(dStr, span),
              startTime,
              endTime,
              notes,
              seriesId
            });
          }

          // 予約できる期間（1年先まで）を超える回があれば、送る前に知らせる
          const tooFar = candidateItems.filter(c => c.endDate > maxStr).length;
          if (tooFar > 0) {
            alert(t('repeatTooFar', { n: tooFar, date: maxStr }));
            return;
          }

          const res = await sendTransaction({ action: "add", items: candidateItems });
          if (res.status !== "success") {
            notifyFailure(res, t('opFailed'));
            return;
          }
          if (res.added === 0) {
            alert(res.skippedRange > 0 ? t('addRangeSkipped', { n: res.skippedRange }) : t('addAllConflict'));
            return;
          }
          const notes2 = [];
          if (res.skipped > 0) notes2.push(t('addPartial', { added: res.added, skipped: res.skipped }));
          if (res.skippedRange > 0) notes2.push(t('addRangeSkipped', { n: res.skippedRange }));
          if (notes2.length) alert(notes2.join('\n'));
          closeBookingModal();
        }
      } finally {
        btn.disabled = false;
        btn.textContent = t('btnSave');
      }
    }

    async function deleteCurrentBooking() {
      if (!editingId || isSyncing) return;
      const orig = reservations.find(r => String(r.id) === String(editingId));
      if (!orig) return;

      const scopeEl = document.querySelector('input[name="seriesScope"]:checked');
      const scope = (orig.seriesId && scopeEl) ? scopeEl.value : 'single';
      const isOther = !isMyBooking(orig);

      let confirmMsg;
      if (scope === 'future') confirmMsg = isOther ? t('confirmDeleteOtherSeries', { name: orig.title }) : t('confirmDeleteSeries');
      else confirmMsg = isOther ? t('confirmDeleteOther', { name: orig.title }) : t('confirmDeleteSelf');
      if (!confirm(confirmMsg)) return;

      closeBookingModal();
      const res = scope === 'future'
        ? await sendTransaction({ action: "deleteSeries", seriesId: orig.seriesId, fromDate: orig.date })
        : await sendTransaction({ action: "delete", id: orig.id, updatedAt: orig.updatedAt });
      notifyFailure(res, t('opFailed'));
    }

    // ==========================================
    // 機器管理（管理者専用・状態の設定も可能）
    // ==========================================
    let isSavingEquipments = false; // 保存中は操作を受け付けない（連打で変更が抜け落ちないように）

    function openSettingsModal() {
      if (userRole !== 'admin') {
        requestAdminSettings();
        return;
      }
      const dis = isSavingEquipments ? 'disabled' : '';
      document.getElementById('uiBtnAddEq').disabled = isSavingEquipments;
      document.getElementById('newEquipmentName').disabled = isSavingEquipments;
      const box = document.getElementById('equipmentListContainer');
      box.innerHTML = equipments.map((eq, i) => {
        const stObj = equipmentStatus[eq] || { status: "", note: "" };
        const noteDisabled = !stObj.status || isSavingEquipments;
        return `
        <div class="bg-slate-50 p-2.5 rounded-lg border ${stObj.status ? 'border-amber-300' : ''} text-sm space-y-1.5">
          <div class="flex justify-between items-center gap-2">
            <span class="truncate flex-1 font-bold text-slate-800">${i + 1}. ${escapeHtml(eq)}</span>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="moveEquipment(${i}, -1)" ${i === 0 || isSavingEquipments ? 'disabled' : ''} title="${escapeHtml(t('moveUp'))}" class="px-1.5 py-0.5 border rounded text-xs bg-white hover:bg-slate-100 disabled:opacity-30">▲</button>
              <button type="button" onclick="moveEquipment(${i}, 1)" ${i === equipments.length - 1 || isSavingEquipments ? 'disabled' : ''} title="${escapeHtml(t('moveDown'))}" class="px-1.5 py-0.5 border rounded text-xs bg-white hover:bg-slate-100 disabled:opacity-30">▼</button>
              <button type="button" onclick="removeEquipment(${i})" ${dis} class="ml-1 px-2 py-0.5 text-red-600 hover:bg-red-50 rounded text-xs font-bold disabled:opacity-30">${escapeHtml(t('btnDelete'))}</button>
            </div>
          </div>
          <div class="flex gap-1.5 items-center">
            <select onchange="changeEqStatus(${i}, this.value)" ${dis} class="border rounded px-2 py-1 text-xs bg-white ${stObj.status ? 'font-bold text-amber-800' : ''}">
              <option value="" ${!stObj.status ? 'selected' : ''}>${escapeHtml(t('statusAvailable'))}</option>
              <option value="broken" ${stObj.status === 'broken' ? 'selected' : ''}>${escapeHtml(t('statusBroken'))}</option>
              <option value="maintenance" ${stObj.status === 'maintenance' ? 'selected' : ''}>${escapeHtml(t('statusMaint'))}</option>
              <option value="stopped" ${stObj.status === 'stopped' ? 'selected' : ''}>${escapeHtml(t('statusStopped'))}</option>
            </select>
            <input type="text" maxlength="100" value="${escapeHtml(stObj.note || '')}" onchange="changeEqStatusNote(${i}, this.value)" ${noteDisabled ? 'disabled' : ''}
              placeholder="${escapeHtml(stObj.status ? t('statusNotePlaceholder') : t('statusNoteDisabled'))}"
              class="flex-1 border rounded px-2 py-1 text-xs bg-white disabled:bg-slate-100 disabled:text-slate-400" />
          </div>
        </div>`;
      }).join('');
      showEl('settingsModal');
    }

    function closeSettingsModal() {
      hideEl('settingsModal');
      renderTagButtons();
      renderCalendar();
    }

    function snapshotEquipments() {
      return [equipments.slice(), JSON.parse(JSON.stringify(equipmentStatus))];
    }

    // 変更前の状態を受け取り、保存に失敗したらその状態に戻す
    async function syncEquipmentsToCloud(prevEquipments, prevStatus) {
      isSavingEquipments = true;
      openSettingsModal();
      const res = await sendTransaction({ action: "saveEquipments", equipments, equipmentStatus });
      isSavingEquipments = false;
      if (res.status === "success") {
        lsSet('okamoto_eq_v1', JSON.stringify(equipments));
        lsSet('okamoto_eq_status_v1', JSON.stringify(equipmentStatus));
      } else if (!res.silent) {
        // サーバーが一覧を返さなかった失敗（通信エラー・混雑など）は手元で元に戻す
        if (!Array.isArray(res.equipments)) {
          equipments = prevEquipments;
          equipmentStatus = prevStatus;
        }
        renderTagButtons();
        renderCalendar();
        notifyFailure(res, t('eqSaveFailed'));
      }
      if (isModalOpen('settingsModal')) openSettingsModal();
    }

    async function changeEqStatus(index, newStatus) {
      if (userRole !== 'admin' || isSavingEquipments) return;
      const [prevEq, prevSt] = snapshotEquipments();
      const eq = equipments[index];
      if (!newStatus) {
        delete equipmentStatus[eq];
      } else {
        equipmentStatus[eq] = { status: newStatus, note: (equipmentStatus[eq] && equipmentStatus[eq].note) || "" };
      }
      await syncEquipmentsToCloud(prevEq, prevSt);
    }

    async function changeEqStatusNote(index, noteVal) {
      const eq = equipments[index];
      if (userRole !== 'admin' || isSavingEquipments || !equipmentStatus[eq]) return;
      const [prevEq, prevSt] = snapshotEquipments();
      equipmentStatus[eq].note = String(noteVal).trim().slice(0, 100);
      await syncEquipmentsToCloud(prevEq, prevSt);
    }

    async function addEquipment() {
      if (userRole !== 'admin' || isSavingEquipments) return;
      const input = document.getElementById('newEquipmentName');
      const val = input.value.trim();
      if (!val) return;
      if (equipments.includes(val)) {
        alert(t('eqDuplicate', { eq: val }));
        return;
      }
      const [prevEq, prevSt] = snapshotEquipments();
      equipments.push(val);
      input.value = "";
      await syncEquipmentsToCloud(prevEq, prevSt);
    }

    async function moveEquipment(index, delta) {
      if (userRole !== 'admin' || isSavingEquipments) return;
      const targetIdx = index + delta;
      if (targetIdx < 0 || targetIdx >= equipments.length) return;
      const [prevEq, prevSt] = snapshotEquipments();
      const temp = equipments[index];
      equipments[index] = equipments[targetIdx];
      equipments[targetIdx] = temp;
      await syncEquipmentsToCloud(prevEq, prevSt);
    }

    async function removeEquipment(i) {
      if (userRole !== 'admin' || isSavingEquipments) return;
      const eq = equipments[i];
      // まだ終わっていない予約が残っていれば件数を警告する
      const nowAbs = nowAbsMin();
      const upcoming = reservations.filter(r => r.equipment === eq && absEndMin(r) > nowAbs).length;
      const question = t('eqRemoveConfirm', { eq }) + (upcoming > 0 ? "\n\n" + t('eqRemoveUpcoming', { n: upcoming }) : "");
      if (!confirm(question)) return;
      const [prevEq, prevSt] = snapshotEquipments();
      equipments.splice(i, 1);
      delete equipmentStatus[eq];
      await syncEquipmentsToCloud(prevEq, prevSt);
    }

    // ==========================================
    // 初期起動処理（保存データが壊れていても止まらないように読み込む）
    // ==========================================
    (function initImmediate() {
      const savedEq = lsGetJSON('okamoto_eq_v1', null);
      if (Array.isArray(savedEq)) equipments = savedEq.filter(x => typeof x === 'string');
      const savedStatus = lsGetJSON('okamoto_eq_status_v1', {});
      equipmentStatus = (savedStatus && typeof savedStatus === 'object' && !Array.isArray(savedStatus)) ? savedStatus : {};
      const savedRes = lsGetJSON('okamoto_res_v1', null);
      if (Array.isArray(savedRes)) {
        try { reservations = normalizeList(savedRes); } catch (e) { reservations = []; }
      }

      if (currentActor) {
        document.getElementById('loginActorInput').value = currentActor;
      }

      applyTranslations();
      updateNameSuggestions();

      if (authKey && userRole) {
        unlockApp(); // 保存済みのパスワードが無効なら、読み込み時にログイン画面へ戻る
      }
    })();

    window.addEventListener('resize', () => {
      if (viewMode === 'day') fitReservationBarFonts();
    });
  </script>
